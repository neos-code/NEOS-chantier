<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#ffffff">
<title>Rapport Ouverture Chantier</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
input[type="date"]{color-scheme:light}
:root {
  --bg:#ffffff; --panel:#f4f5f7; --card:#fafbfc; --border:#e2e5ea;
  --accent:#104d5e; --accent2:#75b0b6; --ok:#16a34a; --danger:#dc2626;
  --text:#17223b; --muted:#64748b; --radius:10px; --shadow:0 4px 24px rgba(23,34,59,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

.app{display:flex;flex:1;overflow:hidden;height:100vh}
.sidebar{width:230px;min-width:230px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-logo{padding:28px 20px 20px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;color:var(--accent);letter-spacing:-.5px}
.sidebar-logo p{font-size:.72rem;color:var(--muted);margin-top:3px}
.nav{padding:12px 10px;flex:1}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;border-radius:7px;cursor:pointer;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--card);color:var(--accent)}
.nav-icon{font-size:1rem;width:20px;text-align:center}
.sidebar-footer{padding:14px 10px;border-top:1px solid var(--border)}
.btn-export{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s}
.btn-back{width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:var(--radius);font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;margin-bottom:8px;transition:all .15s}
.btn-back:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-export:hover{opacity:.88;transform:translateY(-1px)}
.btn-reset{width:100%;margin-top:8px;padding:9px;background:transparent;color:var(--danger);border:1px solid var(--danger);border-radius:var(--radius);font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn-reset:hover{background:rgba(220,38,38,.1)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text)}
.progress-wrap{display:flex;align-items:center;gap:10px}
.progress-bar{width:180px;height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;width:0%}
.progress-label{font-size:.75rem;color:var(--muted);font-family:'DM Mono',monospace}
.content{flex:1;overflow-y:auto;padding:28px 32px}
.page{display:none}
.page.active{display:block}

.section-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
.section-card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:rgba(117,176,182,.06)}
.section-card-header h3{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;color:var(--accent2)}
.section-card-body{padding:18px 20px}
.field-row{display:grid;grid-template-columns:240px 1fr;align-items:start;gap:10px 16px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.field-row:last-child{border-bottom:none}
.yesno{display:flex;gap:8px;padding-top:2px}
.yesno label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.82rem;color:var(--muted);padding:6px 14px;border:1px solid var(--border);border-radius:6px;transition:all .12s;user-select:none}
.yesno input[type=radio]{display:none}
.yesno input[type=radio]:checked + span{color:var(--text)}
.yesno label:has(input:checked){border-color:var(--accent);color:var(--text);background:rgba(16,77,94,.08)}
.field-label{font-size:.82rem;color:var(--muted);padding-top:8px;font-weight:500}
.field-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Mono',monospace;font-size:.82rem;padding:7px 11px;outline:none;transition:border-color .15s}
.field-input:focus{border-color:var(--accent)}
textarea.field-input{resize:vertical;min-height:80px}
select.field-input{cursor:pointer}
select.field-input option{background:var(--card)}
.rapnum-display{background:var(--bg);border:1px solid var(--accent);border-radius:7px;color:var(--accent);font-family:'DM Mono',monospace;font-size:.88rem;font-weight:500;padding:7px 11px;letter-spacing:.5px;user-select:all}

.participants-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.participant-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}
.participant-card label{font-size:.72rem;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
.participant-card textarea{width:100%;background:transparent;border:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.8rem;resize:none;outline:none;min-height:60px;line-height:1.5}
.sig-label{font-size:.68rem;color:var(--muted);margin:6px 0 3px;display:flex;align-items:center;justify-content:space-between}
.sig-clear{background:transparent;border:none;color:var(--accent2);font-size:.68rem;cursor:pointer;text-decoration:underline;padding:0}
.sig-canvas-wrap{background:#fff;border:1px solid var(--border);border-radius:6px;overflow:hidden;touch-action:none}
.sig-canvas{width:100%;height:70px;display:block;cursor:crosshair}

.actions-table{width:100%;border-collapse:collapse}
.actions-table th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.5px}
.actions-table td{padding:6px 4px}
.actions-table input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.82rem;padding:7px 10px;outline:none;transition:border-color .15s}
.actions-table input:focus{border-color:var(--accent)}
.btn-add-row{margin-top:10px;padding:7px 16px;background:transparent;border:1px dashed var(--border);border-radius:7px;color:var(--muted);font-size:.8rem;cursor:pointer;transition:all .15s;width:100%}
.btn-add-row:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-del-row{background:transparent;border:none;color:var(--danger);font-size:1rem;cursor:pointer;padding:4px 8px;border-radius:4px;transition:opacity .15s;opacity:.5}
.action-status-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.76rem;padding:6px 8px;outline:none}
.btn-del-row:hover{opacity:1}

.photo-section-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:14px}
.photo-cat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s}
.photo-cat-card.has-photo{border-color:var(--ok)}
.photo-cat-header{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(117,176,182,.04)}
.photo-cat-title{font-size:.85rem;font-weight:600;color:var(--text)}
.photo-cat-count{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--ok);background:rgba(22,163,74,.12);padding:2px 8px;border-radius:20px;display:none}
.photo-cat-count.show{display:block}
.photo-thumbs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;min-height:0}
.photo-thumb-wrap{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.photo-thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.photo-thumb-wrap:hover .photo-thumb-del{opacity:1}
.photo-cat-actions{padding:8px 12px 12px;display:flex;gap:8px}
.btn-photo-cam{flex:1;padding:8px 6px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif;font-weight:600;transition:opacity .15s}
.btn-photo-cam:hover{opacity:.85}
.btn-photo-gal{flex:1;padding:8px 6px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif;transition:all .12s}
.btn-photo-gal:hover{border-color:var(--accent2);color:var(--accent2)}
.photo-file-hidden{display:none}

/* ═══ POINTS IMPORTANTS ═══ */
.pi-row{display:grid;grid-template-columns:150px auto auto 1fr;align-items:center;gap:10px 12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.pi-row:last-child{border-bottom:none}
.pi-label{font-size:.88rem;font-weight:600;color:var(--text)}
.pi-ras,.pi-reserve{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.pi-ras:hover{border-color:var(--ok);color:var(--ok)}
.pi-reserve:hover{border-color:var(--danger);color:var(--danger)}
.pi-ras.active{border-color:var(--ok);color:var(--ok);background:rgba(22,163,74,.1)}
.pi-reserve.active{border-color:var(--danger);color:var(--danger);background:rgba(220,38,38,.1)}
.pi-comment{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.8rem;padding:7px 10px;outline:none;width:100%;transition:border-color .15s}
.pi-comment:focus{border-color:var(--accent2)}
.pi-wrap{padding:4px 0}
.pi-reserve-panel{display:none;margin-top:8px;padding:12px 14px;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.25);border-radius:8px;flex-direction:column;gap:8px}
.pi-reserve-panel.show{display:flex}
.pi-reserve-title{font-size:.75rem;color:var(--danger);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.pi-action-item{display:grid;grid-template-columns:1fr 120px 100px 28px;gap:6px;align-items:center}
.pi-action-input,.pi-action-who{background:var(--bg);border:1px solid rgba(220,38,38,.3);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.8rem;padding:6px 9px;outline:none;width:100%;transition:border-color .15s}
.pi-action-input:focus,.pi-action-who:focus{border-color:var(--danger)}
.pi-btn-add-action{align-self:flex-start;padding:5px 12px;background:transparent;border:1px dashed rgba(220,38,38,.4);border-radius:6px;color:var(--danger);font-size:.75rem;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.pi-btn-add-action:hover{background:rgba(220,38,38,.08)}
.pi-btn-del{background:transparent;border:none;color:var(--danger);font-size:.85rem;cursor:pointer;opacity:.5;padding:2px 4px;border-radius:4px}
.pi-btn-del:hover{opacity:1}
@media(max-width:700px){
  .pi-row{grid-template-columns:1fr;gap:8px}
  .pi-action-item{grid-template-columns:1fr 28px}
}

.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--ok);color:var(--ok);padding:12px 20px;border-radius:9px;font-size:.85rem;font-weight:500;box-shadow:var(--shadow);z-index:9999;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px 28px;max-width:380px;width:90%;text-align:center;box-shadow:var(--shadow)}
.modal-box h2{font-family:'Syne',sans-serif;font-size:1.1rem;color:var(--text);margin-bottom:10px}
.modal-box p{font-size:.85rem;color:var(--muted);margin-bottom:24px;line-height:1.5}
.modal-actions{display:flex;gap:10px;justify-content:center}
.modal-btn{padding:10px 22px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;transition:opacity .15s}
.modal-btn:hover{opacity:.85}
.modal-btn.cancel{background:var(--border);color:var(--text)}
.modal-btn.confirm{background:var(--danger);color:#fff}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:900px){
  .sidebar{width:56px;min-width:56px}
  .sidebar-logo{padding:14px 8px;text-align:center}
  .sidebar-logo p{display:none}
  .nav{padding:8px 6px}
  .nav-btn{padding:10px 0;justify-content:center}
  .nav-btn span:not(.nav-icon){display:none}
  .sidebar-footer{padding:8px 6px}
  .btn-back{font-size:0;padding:10px;margin-bottom:6px}
  .btn-back::before{content:"←";font-size:1.1rem}
  .btn-export{font-size:0;padding:10px}
  .btn-export::before{content:"⬇";font-size:1.1rem}
  .btn-reset{font-size:0;margin-top:4px;padding:8px}
  .btn-reset::before{content:"🗑";font-size:.9rem}
  .topbar{padding:0 16px}
  .content{padding:16px}
  .field-row{grid-template-columns:160px 1fr}
  .participants-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  html, body { height: 100%; }
  .app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .sidebar{position:fixed;left:0;right:0;bottom:0;width:100%;min-width:0;height:auto;z-index:200;border-right:none;border-top:1px solid var(--border);flex-direction:row;overflow-x:auto;overflow-y:hidden;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -4px 16px rgba(0,0,0,.3)}
  .sidebar-logo{display:none}
  .nav{display:flex;flex-direction:row;padding:4px;flex:1;overflow-x:auto}
  .nav::-webkit-scrollbar{display:none}
  .nav-btn{flex-direction:column;gap:2px;padding:6px 10px;min-width:56px;border-radius:8px;white-space:nowrap}
  .nav-btn>span:not(.nav-icon){display:block;font-size:.6rem}
  .nav-icon{font-size:1.1rem}
  .sidebar-footer{padding:4px 6px;border-top:none;border-left:1px solid var(--border);display:flex;align-items:center;gap:4px}
  .btn-back{width:auto;margin-bottom:0;padding:8px;font-size:0}
  .btn-back::before{content:"←";font-size:1.1rem}
  .btn-export{width:auto;margin:0;padding:8px 12px;font-size:.75rem}
  .btn-reset{width:auto;margin:0;padding:8px;font-size:0}
  .btn-reset::before{content:"🗑";font-size:1.1rem}
  .main{order:1;overflow:visible;flex:none;min-height:0}
  .topbar{height:48px;padding:0 14px;position:sticky;top:0;z-index:100}
  .topbar-title{font-size:.95rem}
  .progress-bar{width:100px}
  .content{padding:12px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));overflow-y:visible}
  .field-row{grid-template-columns:1fr;gap:4px;padding:10px 0}
  .field-label{padding-top:0}
  .participants-grid{grid-template-columns:1fr 1fr}
  .photo-section-grid{grid-template-columns:1fr}
}

@media print {
  @page{margin:15mm;size:A4}
  body{background:#fff!important;color:#111!important}
  .app{display:block!important;height:auto!important}
  .sidebar,.topbar,.btn-export,.btn-add-row,.btn-del-row,.btn-reset,
  .photo-cat-actions,.btn-photo-cam,.btn-photo-gal,.photo-thumb-del{display:none!important}
  .main{overflow:visible!important}
  .content{overflow:visible!important;padding:0!important}
  .page{display:block!important}
  .print-header{display:block!important}
  .section-card{background:#fff!important;border:1px solid #ccc!important;margin-bottom:12px;page-break-inside:avoid}
  .section-card-header{background:#e0f4f8!important;border-bottom:1px solid #ccc!important}
  .section-card-header h3{color:#104d5e!important}
  .field-label{color:#555!important}
  .field-input,textarea.field-input{background:#fafafa!important;border:1px solid #ccc!important;color:#111!important}
  .__print-hide{display:none!important}
  .__print-value{display:block!important;background:#fafafa!important;border:1px solid #ccc!important;border-radius:7px;color:#111!important;font-family:'DM Mono',monospace;font-size:.82rem;padding:7px 11px;white-space:pre-wrap;word-break:break-word}
  .rapnum-display{background:#fafafa!important;border:1px solid #104d5e!important;color:#c07a00!important}
  .participant-card{background:#fafafa!important;border:1px solid #ccc!important}
  .participant-card textarea{color:#111!important}
  .actions-table input{background:#fafafa!important;border:1px solid #ccc!important;color:#111!important}
  .photo-cat-card{background:#fff!important;border:1px solid #ccc!important}
  .photo-thumb-wrap{border:1px solid #ddd!important}
  .pi-ras.active{background:#e6faf3!important;border-color:#2a9e6a!important;color:#1a6a47!important}
  .pi-reserve.active{background:#fef0f0!important;border-color:#d04040!important;color:#a03030!important}
  .pi-ras:not(.active),.pi-reserve:not(.active){opacity:.3!important}
  .pi-reserve-panel{background:#fff8f8!important;border:1px solid #e0aaaa!important}
  .pi-action-input,.pi-action-who{background:#fafafa!important;border:1px solid #f0aaaa!important;color:#111!important}
  .pi-btn-add-action,.pi-btn-del{display:none!important}
  .pi-comment{background:#fafafa!important;border:1px solid #ccc!important;color:#111!important}
}
.print-header,.__print-value{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>🚧 Ouverture</h1>
      <p id="doc-context-label">Rapport Chantier</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <button class="btn-back" onclick="goBackToProject()">← Retour au projet</button>
      <button class="btn-export" onclick="exportPDF()">⬇ Exporter PDF</button>
      <button class="btn-reset" onclick="confirmReset()">🗑 Vider ce rapport</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbar-title"></span>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label">0%</span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-reset">
  <div class="modal-box">
    <h2>🗑 Nouveau rapport ?</h2>
    <p>Toutes les données seront effacées.<br>Le compteur sera incrémenté.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-btn confirm" onclick="doReset()">Confirmer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="jspdf.umd.min.js"></script>
<script>
const PAGES = [
  { id:'entete',       icon:'📋', title:'Général' },
  { id:'participants', icon:'👥', title:'Participants' },
  { id:'reunion',      icon:'📝', title:'Réunion' },
  { id:'actions',      icon:'✅', title:'Actions' },
  { id:'photos',       icon:'📷', title:'Photos' },
];

const PHOTO_SECTIONS = [
  { title:'Photo Site',     labels:['Photo Site 1','Photo Site 2','Photo Site 3','Photo Site 4'] },
  { title:'Photo Matériel', labels:['Photo Matériel 1','Photo Matériel 2','Photo Matériel 3','Photo Matériel 4'] },
  { title:'Autre',          labels:['Autre 1','Autre 2','Autre 3','Autre 4'] },
];

let currentPage = 0;
let actionRows  = [];
const photoData = {};

/* ═══ STORAGE ═══ */
const __params = new URLSearchParams(location.search);
const DOC_ID = __params.get('doc') || 'standalone';
const PROJECT_ID = __params.get('project') || '';
const DOC_LABEL = __params.get('label') || '';
const PFX = 'doc_' + DOC_ID + '_';
function goBackToProject(){
  location.href = PROJECT_ID ? ('index.html?project='+encodeURIComponent(PROJECT_ID)) : 'index.html';
}
document.addEventListener('DOMContentLoaded', ()=>{
  const lbl=document.getElementById('doc-context-label');

function s(id,val){try{localStorage.setItem(PFX+id,val)}catch(e){}}
function g(id,def=''){try{const v=localStorage.getItem(PFX+id);return v!==null?v:def}catch(e){return def}}

/* ═══ DATES (conversion FR <-> ISO pour le sélecteur natif) ═══ */
function __dateToISO(str){
  if(!str) return '';
  const m = String(str).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return '';
  return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
function __dateFromISO(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  return `${m[3]}/${m[2]}/${m[1]}`;
}
function sj(id,val){try{localStorage.setItem(PFX+id,JSON.stringify(val))}catch(e){}}
function gj(id,def){try{const v=localStorage.getItem(PFX+id);return v?JSON.parse(v):def}catch(e){return def}}

/* ═══ TABLEAU D'ACTIONS PARTAGÉ (source unique pour tout le projet) ═══
   Les actions ne sont plus dupliquées par document : elles vivent dans
   neos_project_actions et chaque document les lit/écrit en direct.
   Modifier une action ici la modifie partout (tableau de bord, autres
   documents du même projet). */
function getAllProjectActionsRaw(){
  try{ return JSON.parse(localStorage.getItem('neos_project_actions')||'[]'); }catch(e){ return []; }
}
function saveAllProjectActionsRaw(all){
  try{ localStorage.setItem('neos_project_actions', JSON.stringify(all)); }catch(e){}
}
function getProjectActions(){
  if(!PROJECT_ID) return [];
  return getAllProjectActionsRaw().filter(a=>a.projectId===PROJECT_ID);
}
function upsertProjectAction(patch){
  const all=getAllProjectActionsRaw();
  const idx=all.findIndex(a=>a.id===patch.id);
  if(idx>=0){ all[idx]={...all[idx],...patch,updatedAt:Date.now()}; }
  else{ all.push({ projectId:PROJECT_ID, statut:'À faire', sourceDocId:DOC_ID, sourceLabel:DOC_LABEL||'Ouverture de chantier', createdAt:Date.now(), updatedAt:Date.now(), ...patch }); }
  saveAllProjectActionsRaw(all);
}
function deleteProjectActionById(id){
  saveAllProjectActionsRaw(getAllProjectActionsRaw().filter(a=>a.id!==id));
}
function newActionId(){ return 'act_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ═══ RAPPORT NUM ═══ */
function buildRapNum(){
  const proj=(g('projet_nom')||'').trim().replace(/[^a-zA-Z0-9]/g,'').toUpperCase().substring(0,12);
  const num=String(parseInt(localStorage.getItem(PFX+'rapnum_counter')||'1')).padStart(2,'0');
  return [proj,'RAPOC',num].filter(Boolean).join(' - ');
}
function updateRapNum(){
  const val=buildRapNum(); s('rapport_num',val);
  const el=document.getElementById('f_rapport_num');
  if(el) el.textContent=val||'Sera généré automatiquement';
}

/* ═══ NAV ═══ */
function buildNav(){
  const nav=document.getElementById('nav');
  PAGES.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(i===0?' active':'');
    btn.id='nav-'+p.id;
    btn.innerHTML=`<span class="nav-icon">${p.icon}</span>${p.title}`;
    btn.onclick=()=>switchPage(i);
    nav.appendChild(btn);
  });
}
function switchPage(idx){
  PAGES.forEach((p,i)=>{
    document.getElementById('page-'+p.id)?.classList.toggle('active',i===idx);
    document.getElementById('nav-'+p.id)?.classList.toggle('active',i===idx);
  });
  document.getElementById('topbar-title').textContent=PAGES[idx].title;
  currentPage=idx; updateProgress();
}

function updateProgress(){
  const fields=['rapport_num','technicien','date','projet_nom','localisation','client_nom',
    'puissance','type_installation','type_projet','rappel_projet','date_demarrage',
    'duree_travaux_estimee','remise_dtp','dtp_complet','points_specifiques','date_prochaine_reunion'];

}

/* ═══ SIGNATURE PAD ═══ */
const __sigState = {};
function initSignaturePad(i){
  const canvas = document.getElementById('sig-'+i);
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(rect.width,1) * ratio;
  canvas.height = Math.max(rect.height,1) * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#111';
  __sigState[i] = { drawing:false, ctx, canvas };

  const saved = g('signature_'+i);
  if(saved){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = saved;
  }

  const getPos = (e) => {
    const r = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - r.left, y: point.clientY - r.top };
  };
  const start = (e) => { e.preventDefault(); const st=__sigState[i]; st.drawing=true; const p=getPos(e); st.ctx.beginPath(); st.ctx.moveTo(p.x,p.y); };
  const move = (e) => { const st=__sigState[i]; if(!st.drawing) return; e.preventDefault(); const p=getPos(e); st.ctx.lineTo(p.x,p.y); st.ctx.stroke(); };
  const end = () => { const st=__sigState[i]; if(!st.drawing) return; st.drawing=false; s('signature_'+i, canvas.toDataURL('image/png')); };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSignature(i){
  const st = __sigState[i];
  if(!st) return;
  st.ctx.clearRect(0,0,st.canvas.width,st.canvas.height);
  s('signature_'+i, '');
}

/* ═══ ACTIONS ═══ */
function buildActions(){
  syncPIToActions();
  refreshActions();
}
function refreshActions(){
  actionRows=getProjectActions().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  renderActions();
}
function renderActions(){
  const tbody=document.getElementById('actions-tbody');
  if(!tbody)return; tbody.innerHTML='';
  if(!actionRows.length){
    tbody.innerHTML=`<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:16px;font-size:.8rem">Aucune action pour l'instant.</td></tr>`;
    return;
  }
  actionRows.forEach(row=>{
    const isPI=!!row.linkedKey;
    const tr=document.createElement('tr');
    tr.style.background=isPI?'rgba(220,38,38,.04)':'';
    tr.innerHTML=`
      <td><input value="${esc(row.qui)}" placeholder="Responsable" ${isPI?'style="border-color:rgba(220,38,38,.3)"':''} oninput="updateSharedAction('${row.id}','qui',this.value)"></td>
      <td><input type="date" value="${__dateToISO(row.date)}" ${isPI?'style="border-color:rgba(220,38,38,.3)"':''} onchange="updateSharedAction('${row.id}','date',__dateFromISO(this.value))"></td>
      <td>
        ${isPI?`<span style="font-size:.7rem;color:var(--danger);font-family:'DM Mono',monospace;margin-right:6px;vertical-align:middle">⚠ ${esc(row.linkedLabel)}</span>`:''}
        <input value="${esc(row.action)}" placeholder="Description de l'action..." ${isPI?'style="border-color:rgba(220,38,38,.3)"':''} oninput="updateSharedAction('${row.id}','action',this.value)">
      </td>
      <td>
        <select class="action-status-select" onchange="updateSharedAction('${row.id}','statut',this.value)">
          <option ${(!row.statut||row.statut==='À faire')?'selected':''}>À faire</option>
          <option ${row.statut==='En cours'?'selected':''}>En cours</option>
          <option ${row.statut==='Bloqué'?'selected':''}>Bloqué</option>
          <option ${row.statut==='Fait'?'selected':''}>Fait</option>
        </select>
      </td>
      <td>${isPI?'<span title="Supprimez la réserve dans Points importants" style="opacity:.25;font-size:.8rem;padding:4px 8px;display:inline-block">🔒</span>':`<button class="btn-del-row" onclick="deleteManualAction('${row.id}')">✕</button>`}</td>`;
    tbody.appendChild(tr);
  });
}
function updateSharedAction(id,field,val){
  upsertProjectAction({id,[field]:val});
  actionRows=getProjectActions();
}
function addActionRow(){
  upsertProjectAction({id:newActionId(),qui:'',date:'',action:'',statut:'À faire'});
  refreshActions();
}
function deleteManualAction(id){
  deleteProjectActionById(id);
  refreshActions();
}

/* ═══ POINTS IMPORTANTS ═══ */
const PI_POINTS = ['Point sécu','Point tech','Matériel'];

function buildPointsImportants(){
  const body=document.getElementById('pi-body');
  if(!body)return;
  body.innerHTML='';
  PI_POINTS.forEach(label=>{
    const pid=piId(label);
    const wrap=document.createElement('div');
    wrap.className='pi-wrap';
    const state=g('pi_state_'+pid,'');
    wrap.innerHTML=`
      <div class="pi-row">
        <span class="pi-label">${label}</span>
        <button class="pi-ras${state==='ras'?' active':''}" id="pi-ras-${pid}" onclick="togglePI('${label}','ras')">✔ RAS</button>
        <button class="pi-reserve${state==='reserve'?' active':''}" id="pi-res-${pid}" onclick="togglePI('${label}','reserve')">⚠ Réserves</button>
        <input class="pi-comment" id="pi-cmt-${pid}" placeholder="Commentaire..." value="${esc(g('pi_cmt_'+pid))}" oninput="s('pi_cmt_${pid}',this.value)">
      </div>
      <div class="pi-reserve-panel${state==='reserve'?' show':''}" id="pi-panel-${pid}">
        <span class="pi-reserve-title">🔴 Actions générées — ${label}</span>
        <div id="pi-actions-${pid}"></div>
        <button class="pi-btn-add-action" onclick="addPIAction('${label}')">＋ Ajouter une action</button>
      </div>`;
    body.appendChild(wrap);
    renderPIActions(label);
  });
}

function piId(label){return label.replace(/[^a-zA-Z0-9]/g,'_')}

function togglePI(label,type){
  const pid=piId(label);
  const current=g('pi_state_'+pid);
  const newVal=current===type?'':type;
  s('pi_state_'+pid,newVal);
  document.getElementById('pi-ras-'+pid)?.classList.toggle('active',newVal==='ras');
  document.getElementById('pi-res-'+pid)?.classList.toggle('active',newVal==='reserve');
  const panel=document.getElementById('pi-panel-'+pid);
  if(panel) panel.classList.toggle('show',newVal==='reserve');
  // Auto-add first action row when switching to reserve
  if(newVal==='reserve'){
    const actions=gj('pi_actions_'+pid,[]);
    if(actions.length===0){
      actions.push({action:'',qui:'',date:''});
      sj('pi_actions_'+pid,actions);
      renderPIActions(label);
    }
  }
  // Always sync to main actions table
  syncPIToActions();
  refreshActions();
  if(newVal==='reserve') showToast(`⚠ Réserve "${label}" → action ajoutée dans Actions`);
}

function renderPIActions(label){
  const pid=piId(label);
  const container=document.getElementById('pi-actions-'+pid);
  if(!container)return;
  const actions=gj('pi_actions_'+pid,[]);
  container.innerHTML='';
  actions.forEach((a,i)=>{
    const row=document.createElement('div');
    row.className='pi-action-item';
    row.innerHTML=`
      <input class="pi-action-input" placeholder="Description de l'action..." value="${esc(a.action||'')}" oninput="updatePIAction('${label}',${i},'action',this.value)">
      <input class="pi-action-who" placeholder="Responsable" value="${esc(a.qui||'')}" oninput="updatePIAction('${label}',${i},'qui',this.value)">
      <input class="pi-action-who" type="date" value="${__dateToISO(a.date||'')}" onchange="updatePIAction('${label}',${i},'date',__dateFromISO(this.value))">
      <button class="pi-btn-del" onclick="delPIAction('${label}',${i})">✕</button>`;
    container.appendChild(row);
  });
}

function addPIAction(label){
  const pid=piId(label);
  const actions=gj('pi_actions_'+pid,[]);
  actions.push({action:'',qui:'',date:''});
  sj('pi_actions_'+pid,actions);
  renderPIActions(label);
  syncPIToActions();
  refreshActions();
}

function delPIAction(label,idx){
  const pid=piId(label);
  const actions=gj('pi_actions_'+pid,[]);
  actions.splice(idx,1);
  sj('pi_actions_'+pid,actions);
  renderPIActions(label);
  syncPIToActions();
  refreshActions();
}

function updatePIAction(label,idx,field,val){
  const pid=piId(label);
  const actions=gj('pi_actions_'+pid,[]);
  if(!actions[idx])return;
  actions[idx][field]=val;
  sj('pi_actions_'+pid,actions);
  syncPIToActions();
  refreshActions();
}

// Pousse les actions liées aux Points importants (réserves) dans le tableau
// partagé du projet, avec un identifiant stable par point + index — jamais
// dupliqué, toujours mis à jour en place.
function syncPIToActions(){
  PI_POINTS.forEach(label=>{
    const pid=piId(label);
    const isReserve=g('pi_state_'+pid)==='reserve';
    const linkedPrefix='pi_'+pid+'_';
    const existingLinked=getProjectActions().filter(a=>a.linkedKey&&a.linkedKey.startsWith(linkedPrefix));
    if(!isReserve){
      existingLinked.forEach(a=>deleteProjectActionById(a.id));
      return;
    }
    const piActions=gj('pi_actions_'+pid,[]);
    piActions.forEach((a,idx)=>{
      upsertProjectAction({
        id: linkedPrefix+idx,
        qui: a.qui||'', date: a.date||'', action: a.action||'',
        linkedKey: linkedPrefix+idx, linkedLabel: label,
        sourceDocId: DOC_ID, sourceLabel: DOC_LABEL||'Ouverture de chantier'
      });
    });
    // retire les entrées devenues obsolètes (actions PI supprimées)
    existingLinked.forEach(a=>{
      const idx=parseInt(a.linkedKey.slice(linkedPrefix.length));
      if(idx>=piActions.length) deleteProjectActionById(a.id);
    });
  });
}

/* ═══ PHOTOS ═══ */
function handlePhotos(label,input){
  const files=Array.from(input.files);
  if(!files.length)return;
  if(!photoData[label])photoData[label]=[];
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      photoData[label].push(e.target.result);
      loaded++;
      if(loaded===files.length){savePhotos();renderPhotoThumbs(label);showToast(`✔ ${files.length} photo(s) — ${label}`);}
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}
function renderPhotoThumbs(label){
  const cid=catId(label);
  const container=document.getElementById('pthumbs-'+cid);
  const countEl=document.getElementById('pcnt-'+cid);
  const cardEl=document.getElementById('pcat-'+cid);
  if(!container)return;
  const photos=photoData[label]||[];
  container.innerHTML=photos.map((dataUrl,i)=>`
    <div class="photo-thumb-wrap">
      <img src="${dataUrl}" alt="">
      <button class="photo-thumb-del" onclick="deletePhoto('${label}',${i})">✕</button>
    </div>`).join('');
  if(countEl){countEl.textContent=photos.length;countEl.classList.toggle('show',photos.length>0)}
  if(cardEl)cardEl.classList.toggle('has-photo',photos.length>0);
}
function deletePhoto(label,idx){
  if(!photoData[label])return;
  photoData[label].splice(idx,1);
  savePhotos();renderPhotoThumbs(label);
}
function savePhotos(){sj('photos',photoData)}
function restorePhotos(){
  const saved=gj('photos',{});
  Object.assign(photoData,saved);
  PHOTO_SECTIONS.forEach(sec=>sec.labels.forEach(label=>{
    if(photoData[label]?.length)renderPhotoThumbs(label);
  }));
}

/* ═══ EXPORT PDF ═══ */
/* ═══════════════════════════════════════════
   EXPORT PDF (génération directe, sans passer par
   l'impression du navigateur — plus fiable sur mobile)
═══════════════════════════════════════════ */
function __loadImageDims(dataUrl){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve({ w: 0, h: 0 });
    img.src = dataUrl;
  });
}

async function exportPDF(){
  showToast('📄 Génération du PDF en cours…', 4000);
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    const pageW=210, pageH=297, marginX=15, contentW=pageW-marginX*2, bottomLimit=pageH-15;
    let y=20;
    const checkBreak=(needed)=>{ if(y+needed>bottomLimit){ doc.addPage(); y=20; } };
    const sectionTitle=(t)=>{
      checkBreak(10);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(16,77,94);
      doc.text(t, marginX, y); y+=3;
      doc.setDrawColor(210,210,210); doc.setLineWidth(0.2);
      doc.line(marginX,y,pageW-marginX,y); y+=5;
    };
    const addField=(label,val)=>{
      const value=(val&&String(val).trim())?String(val):'\u2014';
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(60,60,60);
      const labelText=label+' :';
      doc.text(labelText, marginX, y);
      const labelW=doc.getTextWidth(labelText);
      const valX=marginX+Math.min(labelW+3,70);
      const valW=contentW-(valX-marginX);
      doc.setFont('helvetica','normal'); doc.setTextColor(15,15,15);
      const lines=doc.splitTextToSize(value, valW);
      checkBreak(lines.length*4.3+2);
      doc.setFont('helvetica','bold'); doc.setTextColor(60,60,60);
      doc.text(labelText, marginX, y);
      doc.setFont('helvetica','normal'); doc.setTextColor(15,15,15);
      doc.text(lines, valX, y);
      y += Math.max(lines.length*4.3,4.3)+1.8;
    };

    const proj=g('projet_nom')||'\u2014', tech=g('technicien')||'\u2014', date=g('date')||new Date().toLocaleDateString('fr-FR');
    const rapnum=buildRapNum()||'\u2014';
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(16,77,94);
    doc.text('RAPPORT OUVERTURE CHANTIER', marginX, y); y+=6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(85,85,85);
    doc.text(`N° : ${rapnum}`, marginX, y); y+=5;
    doc.text(`Projet : ${proj}   |   Technicien : ${tech}   |   Date : ${date}`, marginX, y); y+=4;
    doc.setDrawColor(16,77,94); doc.setLineWidth(0.6);
    doc.line(marginX,y,pageW-marginX,y); y+=8;

    sectionTitle('Informations du projet');
    addField('Localisation / GPS', g('localisation'));
    addField('Nom du client', g('client_nom'));
    addField('Puissance prévue (kWc)', g('puissance'));
    addField("Type d'installation", g('type_installation'));
    addField('Type de projet', g('type_projet'));

    sectionTitle('Participants présents');
    for(let i=1;i<=5;i++){
      const p=g('participant_'+i);
      const sig=g('signature_'+i);
      if(!(p && p.trim()) && !sig) continue;
      addField('Participant '+i, p.replace(/\n/g,' — '));
      if(sig){
        const dims = await __loadImageDims(sig);
        let imgW=45, imgH=15;
        if(dims.w && dims.h){ imgH = imgW * (dims.h/dims.w); if(imgH>20){ imgH=20; imgW=imgH*(dims.w/dims.h); } }
        checkBreak(imgH+6);
        doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(120,120,120);
        doc.text('Signature :', marginX, y); y+=3;
        try {
          doc.addImage(sig, 'PNG', marginX, y, imgW, imgH);
          y += imgH+4;
        } catch(e){ y+=4; }
      }
    }

    sectionTitle('Points de la réunion');
    addField('Rappel du projet', g('rappel_projet'));
    addField('Date de démarrage chantier', g('date_demarrage'));
    addField('Durée des travaux estimée', g('duree_travaux_estimee'));
    addField('Remise DTP', g('remise_dtp'));
    addField('DTP complet', g('dtp_complet'));
    addField('Commentaire libre', g('points_specifiques'));

    sectionTitle('Points importants');
    PI_POINTS.forEach(label=>{
      const pid=piId(label);
      const state=g('pi_state_'+pid);
      const stateTxt = state==='ras' ? 'RAS' : state==='reserve' ? 'Réserves' : '\u2014';
      addField(label, stateTxt);
      const cmt=g('pi_cmt_'+pid);
      if(cmt && cmt.trim()) addField('  Commentaire', cmt);
      if(state==='reserve'){
        const actions=gj('pi_actions_'+pid,[]);
        actions.forEach((a,i)=>{
          if(a.action||a.qui||a.date){
            addField(`  Action ${i+1}`, `${a.action||'\u2014'} (Responsable: ${a.qui||'\u2014'}, Date: ${a.date||'\u2014'})`);
          }
        });
      }
    });

    sectionTitle('Actions à mener');
    getProjectActions().forEach((row,i)=>{
      if(row.qui || row.date || row.action){
        addField(`Action ${i+1}`, `${row.action||'\u2014'} (Responsable: ${row.qui||'\u2014'}, Date: ${row.date||'\u2014'}, Statut: ${row.statut||'À faire'})`);
      }
    });

    sectionTitle('Prochaine réunion');
    addField('Date', g('date_prochaine_reunion'));
    addField('Rédigé par', g('redige_par'));

    // Photos
    const photoSections = PHOTO_SECTIONS.filter(sec => sec.labels.some(l => (photoData[l]||[]).length));
    if(photoSections.length){
      doc.addPage(); y=20;
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(16,77,94);
      doc.text('PHOTOS', marginX, y); y+=9;
      for(const sec of photoSections){
        for(const label of sec.labels){
          const photos=photoData[label]||[];
          if(!photos.length) continue;
          checkBreak(8);
          doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(16,77,94);
          doc.text(`${sec.title} — ${label}`, marginX, y); y+=5;
          for(const dataUrl of photos){
            const dims = await __loadImageDims(dataUrl);
            let imgW=contentW, imgH=70;
            if(dims.w && dims.h){
              imgW=Math.min(contentW,130); imgH=imgW*(dims.h/dims.w);
              if(imgH>100){ imgH=100; imgW=imgH*(dims.w/dims.h); }
            }
            checkBreak(imgH+6);
            try {
              const fmt = dataUrl.startsWith('data:image/png') ? 'PNG' : 'JPEG';
              doc.addImage(dataUrl, fmt, marginX, y, imgW, imgH);
              y += imgH+4;
            } catch(e){
              doc.setFont('helvetica','italic'); doc.setFontSize(8.5);
              doc.text('(photo non intégrée)', marginX, y); y+=5;
            }
          }
          y+=3;
        }
      }
    }

    const filename = `RapportOuverture_${rapnum.replace(/[^a-zA-Z0-9-]/g,'_')}.pdf`;
    doc.save(filename);
    showToast('✔ PDF généré : '+filename, 3500);
  } catch(e){
    console.error(e);
    showToast('\u274c Erreur lors de la génération du PDF : '+e.message, 6000);
  }
}

/* ═══ RESET ═══ */
function confirmReset(){document.getElementById('modal-reset').classList.add('show')}
function closeModal(){document.getElementById('modal-reset').classList.remove('show')}
function doReset(){
  const n=parseInt(localStorage.getItem(PFX+'rapnum_counter')||'0')+1;
  localStorage.setItem(PFX+'rapnum_counter',String(n));
  Object.keys(localStorage).filter(k=>k.startsWith(PFX)&&k!==PFX+'rapnum_counter').forEach(k=>localStorage.removeItem(k));
  actionRows=[];
  Object.keys(photoData).forEach(k=>delete photoData[k]);
  closeModal();
  document.getElementById('content').innerHTML='';
  document.getElementById('nav').innerHTML='';
  buildNav();buildContent();switchPage(0);updateProgress();
  showToast(`✔ Nouveau rapport — N° ${String(n).padStart(2,'0')}`);
}

/* ═══ PRÉ-REMPLISSAGE DEPUIS LE PROJET ═══
   Si le champ n'a jamais été saisi dans CE document, on le seed avec
   les infos du projet (transmises en paramètres d'URL depuis le tableau
   de bord). Ne remplace jamais une valeur déjà saisie par l'utilisateur. */
function __seedFromProject(){
  const map = {
    projet_nom:       __params.get('p_nom'),
    client_nom:       __params.get('p_client'),
    localisation:     __params.get('p_localisation'),
    puissance:        __params.get('p_puissance'),
    type_projet:      __params.get('p_type_projet'),
    type_installation:__params.get('p_type_installation'),
  };
  Object.entries(map).forEach(([key,val])=>{
    if(val && !g(key)) s(key,val);
  });
}

/* ═══ TOAST ═══ */
function showToast(msg,d=2800){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),d);
}

/* ═══ INIT ═══ */
(function init(){
  if(!localStorage.getItem(PFX+'rapnum_counter'))localStorage.setItem(PFX+'rapnum_counter','1');
  __seedFromProject();
  buildNav();buildContent();switchPage(0);updateProgress();
  showToast('📋 Formulaire chargé — données sauvegardées automatiquement');
})();
</script>
