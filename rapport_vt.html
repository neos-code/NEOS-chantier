<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#ffffff">
<title>Rapport Visite Technique</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
input[type="date"]{color-scheme:light}
/* ═══════════════════════════════════════════
   VARIABLES & RESET
═══════════════════════════════════════════ */
:root {
  --bg:        #ffffff;
  --panel:     #f4f5f7;
  --card:      #fafbfc;
  --border:    #e2e5ea;
  --accent:    #104d5e;
  --accent2:   #75b0b6;
  --ok:        #16a34a;
  --danger:    #dc2626;
  --text:      #17223b;
  --muted:     #64748b;
  --radius:    10px;
  --shadow:    0 4px 24px rgba(23,34,59,.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ═══════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════ */
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
.topbar-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--accent);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title span{font-weight:400;opacity:.6;font-size:.78rem;margin-left:6px}
.progress-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0}
.progress-bar{width:120px;height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;width:0%}
.progress-label{font-size:.7rem;color:var(--muted);font-family:'DM Mono',monospace}
.topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn-sm{padding:7px 14px;border:none;border-radius:7px;font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-back{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-back:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-export{background:var(--accent);color:#fff;border:none}
.btn-export:hover{opacity:.88}
.btn-export:active{transform:translateY(0)}
.btn-reset{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-reset:hover{background:rgba(220,38,38,.1)}

/* ═══════════════════════════════════════════
   TABS
═══════════════════════════════════════════ */
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--border);padding:0 12px;gap:2px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.nav-btn{display:flex;align-items:center;gap:6px;padding:12px 16px;border:none;background:transparent;border-bottom:2px solid transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;margin-bottom:-1px;position:relative}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-btn .nav-icon{font-size:1rem}
.nav-badge{
  background: var(--ok);
  color:#fff;
  font-size: .6rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 20px;
  display: none;
}
.nav-badge.show { display: inline-block; }

.content {
  padding: 28px 32px;
  max-width: 1100px;
  margin: 0 auto;
}

/* ═══════════════════════════════════════════
   PAGES
═══════════════════════════════════════════ */
.page { display: none; }
.page.active { display: block; }
/* Utilisé brièvement avant l'impression pour rendre toutes les pages
   mesurables (layout réel) sans les rendre visibles à l'écran */
body.measuring-print .page { display: block !important; visibility: hidden !important; }

/* ═══════════════════════════════════════════
   FORM CARDS
═══════════════════════════════════════════ */
.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
}
.section-card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-card-header h3 {
  font-family: 'Syne', sans-serif;
  font-size: .95rem;
  font-weight: 700;
  color: var(--accent2);
}
.section-card-body { padding: 18px 20px; }

.field-row {
  display: grid;
  grid-template-columns: 220px 1fr;
  align-items: start;
  gap: 10px 16px;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.field-row:last-child { border-bottom: none; }
.field-label {
  font-size: .82rem;
  color: var(--muted);
  padding-top: 8px;
  font-weight: 500;
}
.field-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: .82rem;
  padding: 7px 11px;
  outline: none;
  transition: border-color .15s;
}
.field-input:focus { border-color: var(--accent); }
textarea.field-input { resize: vertical; min-height: 68px; }
select.field-input { cursor: pointer; }
select.field-input option { background: var(--card); }

/* yesno */
.yesno { display: flex; gap: 8px; padding-top: 2px; }
.yesno label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: .82rem;
  color: var(--muted);
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  transition: all .12s;
  user-select: none;
}
.yesno input[type=radio] { display: none; }
.yesno input[type=radio]:checked + span { color: var(--text); }
.yesno label:has(input:checked) { border-color: var(--accent); color: var(--text); background: rgba(16,77,94,.08); }

/* ═══════════════════════════════════════════
   PHOTOS PAGE
═══════════════════════════════════════════ */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.photo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color .15s;
}
.photo-card.has-photo { border-color: var(--ok); }
.photo-card-inline { margin: 12px 0; }
.photo-card-header {
  padding: 11px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
}
.photo-num {
  font-family: 'DM Mono', monospace;
  font-size: .7rem;
  font-weight: 500;
  color: var(--accent);
  background: rgba(16,77,94,.1);
  padding: 2px 7px;
  border-radius: 4px;
}
.photo-label { font-size: .82rem; font-weight: 500; flex: 1; }
.photo-status { font-size: .7rem; color: var(--muted); }
.photo-status.done { color: var(--ok); }

.photo-preview {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: none;
  background: var(--bg);
}
.photo-preview.visible { display: block; }
.photo-placeholder {
  height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: .78rem;
  gap: 6px;
}
.photo-placeholder .ph-icon { font-size: 2rem; opacity: .3; }
.photo-placeholder.hidden { display: none; }

.photo-actions { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.btn-photo {
  width: 100%;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  color: var(--text);
  font-size: .8rem;
  cursor: pointer;
  transition: all .12s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-photo:hover { border-color: var(--accent); color: var(--accent); }
.btn-photo.primary { background: var(--accent); color:#fff; border-color: var(--accent); font-weight: 600; }
.btn-photo.primary:hover { opacity: .85; }
.btn-photo.danger { border-color: var(--danger); color: var(--danger); }
.btn-photo.danger:hover { background: rgba(220,38,38,.1); }
.photo-actions-row { display: flex; gap: 8px; }
.photo-actions-row .btn-photo { flex: 1; }
.photo-comment {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  padding: 6px 10px;
  resize: none;
  outline: none;
  height: 52px;
}
.photo-comment:focus { border-color: var(--accent2); }
.photo-file-input { display: none; }

/* ═══════════════════════════════════════════
   RESPONSIVE — TABLETTE & MOBILE
═══════════════════════════════════════════ */

/* Tablette (≤ 900px) : sidebar rétractée en barre d'icônes */
@media (max-width: 900px) {
  .content { padding: 20px; }
  .field-row { grid-template-columns: 160px 1fr; }
}

/* Mobile (≤ 600px) */
@media (max-width: 600px) {
  .topbar { padding: 0 12px; height: 52px; }
  .topbar-title { font-size: .88rem; }
  .topbar-title span { display: none; }
  .progress-wrap { display: none; }
  .btn-back { font-size: 0; padding: 8px; }
  .btn-back::before { content: "←"; font-size: 1.1rem; }
  .btn-export { padding: 8px 12px; font-size: .72rem; }
  .btn-reset { font-size: 0; padding: 8px; }
  .btn-reset::before { content: "🗑"; font-size: 1.1rem; }
  .tabs { padding: 0 6px; }
  .nav-btn { padding: 10px 12px; font-size: .78rem; }
  .nav-badge { position: absolute; top: 2px; right: 2px; font-size: .5rem; padding: 1px 3px; }

  .content {
    padding: 14px;
  }

  /* champs en colonne */
  .field-row {
    grid-template-columns: 1fr;
    gap: 4px;
    padding: 10px 0;
  }
  .field-label { padding-top: 0; font-size: .8rem; }
  .field-input { font-size: .9rem; padding: 9px 12px; }
  select.field-input { font-size: .9rem; }
  .yesno label { padding: 8px 16px; font-size: .85rem; }

  /* cards */
  .section-card { border-radius: 10px; margin-bottom: 14px; }
  .section-card-header { padding: 12px 14px; }
  .section-card-body { padding: 12px 14px; }

  /* photos */
  .photo-grid { grid-template-columns: 1fr; gap: 12px; }
  .photo-preview { height: 200px; }
  .btn-photo { padding: 12px; font-size: .9rem; }
}

/* ═══════════════════════════════════════════
   PRINT / PDF
═══════════════════════════════════════════ */
@media print {
  @page { margin: 15mm 15mm; size: A4; }

  body { background: #fff !important; color: #111 !important; font-family: 'DM Sans', Arial, sans-serif; }
  .topbar, .tabs, .progress-wrap, .btn-export,
  .btn-photo, .photo-actions, .photo-file-input,
  .photo-placeholder { display: none !important; }
  .content { overflow: visible !important; padding: 0 !important; max-width: none !important; }
  .page { display: block !important; }
  .page:not(.print-active) { display: none !important; }

  .print-header { display: block !important; }
  .section-card {
    background: #fff !important;
    border: 1px solid #ddd !important;
    margin-bottom: 12px;
    page-break-inside: avoid;
  }
  .section-card-header { background: #f5f5f5 !important; border-bottom: 1px solid #ddd !important; }
  .section-card-header h3 { color: #104d5e !important; }
  .field-label { color: #555 !important; }
  .field-input, select.field-input, textarea.field-input {
    background: #fafafa !important;
    border: 1px solid #ccc !important;
    color: #111 !important;
  }
  textarea.field-input {
    overflow: visible !important;
    resize: none !important;
  }
  input.print-hide-field { display: none !important; }
  .print-text-value,
  .__print-value {
    display: block !important;
    background: #fafafa !important;
    border: 1px solid #ccc !important;
    border-radius: 7px;
    color: #111 !important;
    font-family: 'DM Mono', monospace;
    font-size: .82rem;
    padding: 7px 11px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .__print-hide { display: none !important; }
  .yesno label { border-color: #ccc !important; color: #555 !important; }
  .yesno label:has(input:checked) { background: #e8f0fe !important; border-color: #104d5e !important; color: #111 !important; }

  /* print photos */
  .print-photos { display: block !important; }
  .print-photo-item { page-break-inside: avoid; margin-bottom: 16px; }
  .print-photo-item img { max-width: 100%; max-height: 200px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; }
  .print-photo-caption { font-size: .8rem; color: #444; margin-top: 4px; }
}

/* hidden in screen */
.print-header, .print-photos, .print-text-value, .__print-value { display: none; }

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--card);
  border: 1px solid var(--ok);
  color: var(--ok);
  padding: 12px 20px;
  border-radius: 9px;
  font-size: .85rem;
  font-weight: 500;
  box-shadow: var(--shadow);
  z-index: 9999;
  opacity: 0;
  transform: translateY(12px);
  transition: all .25s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ═══════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* modal reset */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 10000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 32px 28px;
  max-width: 380px;
  width: 90%;
  text-align: center;
  box-shadow: var(--shadow);
}
.modal-box h2 { font-family: 'Syne', sans-serif; font-size: 1.1rem; color: var(--text); margin-bottom: 10px; }
.modal-box p { font-size: .85rem; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; justify-content: center; }
.modal-btn {
  padding: 10px 22px;
  border: none;
  border-radius: 8px;
  font-family: 'Syne', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.modal-btn:hover { opacity: .85; }
.modal-btn.cancel { background: var(--border); color: var(--text); }
.modal-btn.confirm { background: var(--danger); color: #fff; }

/* modal camera */
.camera-box { max-width: 480px; }
.camera-viewport {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 18px;
}
.camera-viewport video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.camera-viewport img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
.camera-viewport img.visible { display: block; }

/* modal annotation */
.annotate-box { max-width: 600px; }
.annotate-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.color-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer;
  padding: 0;
}
.color-dot.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--accent); }
.annotate-toolbar .btn-clear {
  margin-left: auto;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  color: var(--text);
  font-size: .78rem;
  cursor: pointer;
}
.annotate-toolbar .btn-clear:hover { border-color: var(--danger); color: var(--danger); }
.annotate-canvas-wrap {
  width: 100%;
  max-height: 55vh;
  overflow: auto;
  background: #000;
  border-radius: 10px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#annotate-canvas { touch-action: none; max-width: 100%; max-height: 55vh; display: block; cursor: crosshair; }

/* rapport num display */
.rapnum-display {
  background: var(--bg);
  border: 1px solid var(--accent);
  border-radius: 7px;
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: .88rem;
  font-weight: 500;
  padding: 7px 11px;
  letter-spacing: .5px;
  user-select: all;
}


</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="btn-sm btn-back" onclick="goBackToProject()">← Retour</button>
    <span class="topbar-title">⚡ VT Rapport <span id="doc-context-label"></span></span>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0%</span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn-sm btn-export" onclick="exportPDF()">⬇ Exporter PDF</button>
    <button class="btn-sm btn-reset" onclick="confirmReset()">🗑 Vider ce rapport</button>
  </div>
</div>
<div class="tabs" id="nav"></div>
<div class="content" id="content"></div>

<!-- MODAL RESET -->
<div class="modal-overlay" id="modal-reset">
  <div class="modal-box">
    <h2>🗑 Nouveau rapport ?</h2>
    <p>Toutes les données du formulaire actuel seront effacées.<br>Le compteur de rapport sera incrémenté.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-btn confirm" onclick="doReset()">Confirmer</button>
    </div>
  </div>
</div>

<!-- MODAL CAMERA -->
<div class="modal-overlay" id="modal-camera">
  <div class="modal-box camera-box">
    <h2>📷 Prendre une photo</h2>
    <div class="camera-viewport">
      <video id="camera-video" autoplay playsinline muted></video>
      <img id="camera-preview" alt="">
    </div>
    <canvas id="camera-canvas" style="display:none"></canvas>
    <div class="modal-actions" id="camera-actions-live">
      <button class="modal-btn cancel" onclick="closeCamera()">Annuler</button>
      <button class="modal-btn confirm" onclick="captureCameraPhoto()">📸 Capturer</button>
    </div>
    <div class="modal-actions" id="camera-actions-preview" style="display:none">
      <button class="modal-btn cancel" onclick="retakeCameraPhoto()">↺ Reprendre</button>
      <button class="modal-btn confirm" onclick="confirmCameraPhoto()">✔ Utiliser</button>
    </div>
  </div>
</div>

<!-- MODAL ANNOTATION -->
<div class="modal-overlay" id="modal-annotate">
  <div class="modal-box annotate-box">
    <h2>✏️ Annoter la photo</h2>
    <div class="annotate-toolbar">
      <button class="color-dot" data-color="#ff3b30" style="background:#ff3b30" onclick="setDrawColor('#ff3b30')" title="Rouge"></button>
      <button class="color-dot" data-color="#ffcc00" style="background:#ffcc00" onclick="setDrawColor('#ffcc00')" title="Jaune"></button>
      <button class="color-dot" data-color="#0a84ff" style="background:#0a84ff" onclick="setDrawColor('#0a84ff')" title="Bleu"></button>
      <button class="color-dot" data-color="#34c759" style="background:#34c759" onclick="setDrawColor('#34c759')" title="Vert"></button>
      <button class="color-dot" data-color="#ffffff" style="background:#ffffff" onclick="setDrawColor('#ffffff')" title="Blanc"></button>
      <button class="btn-clear" onclick="clearAnnotations()">↺ Effacer le dessin</button>
    </div>
    <div class="annotate-canvas-wrap">
      <canvas id="annotate-canvas"></canvas>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeAnnotate()">Annuler</button>
      <button class="modal-btn confirm" onclick="saveAnnotation()">✔ Enregistrer</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="jspdf.umd.min.js"></script>
<script>
/* ═══════════════════════════════════════════
   DONNÉES DU FORMULAIRE
═══════════════════════════════════════════ */
const SECTIONS = [
  { id:"entete", icon:"📋", title:"Général", groups:[
    { title:"Informations générales", fields:[
      { id:"rapport_num",   label:"N° de rapport (auto)", type:"rapnum" },
      { id:"technicien",    label:"Technicien",        type:"text" },
      { id:"date",          label:"Date",              type:"date", default: new Date().toLocaleDateString('fr-FR') },
    ]},
    { title:"Identification du projet", fields:[
      { id:"dept",          label:"N° département (2 chiffres)", type:"text_dept" },
      { id:"projet_nom",    label:"Nom du projet",               type:"text_rapnum" },
      { id:"localisation",  label:"Localisation / GPS",          type:"text" },
      { id:"client_nom",    label:"Nom du client",               type:"text" },
    ]},

function buildNav() {
  const nav = document.getElementById('nav');
  const pages = SECTIONS;
  pages.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
    btn.id = `nav-${s.id}`;
    btn.innerHTML = `<span class="nav-icon">${s.icon}</span>${s.title}<span class="nav-badge" id="badge-${s.id}">✓</span>`;
    btn.onclick = () => switchPage(i);
    nav.appendChild(btn);
  });
}

function buildContent() {
  const content = document.getElementById('content');

  // Form sections
  SECTIONS.forEach(section => {
    const page = document.createElement('div');
    page.className = 'page';
    page.id = `page-${section.id}`;

    section.groups.forEach(group => {
      const card = document.createElement('div');
      card.className = 'section-card';
      card.innerHTML = `
        <div class="section-card-header"><h3>${group.title}</h3></div>
        <div class="section-card-body" id="body-${group.title.replace(/\s/g,'_')}"></div>`;
      const body = card.querySelector('.section-card-body');

      group.fields.forEach(field => {
        if (field.type === 'photo') {
          body.appendChild(renderPhotoCard(field.label, field.num));
          return;
        }
        const row = document.createElement('div');
        row.className = 'field-row';
        row.id = 'row-' + field.id;
        if (field.showIf) {
          const triggerVal = loadVal(field.showIf.field);
          row.style.display = (triggerVal === field.showIf.value) ? '' : 'none';
        }
        row.innerHTML = `<span class="field-label">${field.label}</span>${buildField(field)}`;
        body.appendChild(row);
      });

      page.appendChild(card);
    });
    content.appendChild(page);
  });
}

function updateConditionalFields(){
  SECTIONS.forEach(section => section.groups.forEach(group => group.fields.forEach(field => {
    if (!field.showIf) return;
    const row = document.getElementById('row-' + field.id);
    if (!row) return;
    const triggerVal = loadVal(field.showIf.field);
    row.style.display = (triggerVal === field.showIf.value) ? '' : 'none';
  })));
}

/* ═══ DATES (conversion FR <-> ISO pour le sélecteur natif) ═══ */
function __dateToISO(str){
  if(!str) return '';
  const m = String(str).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return '';
  return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
function __dateFromISO(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  return `${m[3]}/${m[2]}/${m[1]}`;
}

function buildField(field) {
  const val = loadVal(field.id);
  if (field.type === 'rapnum') {
    return `<div class="rapnum-display" id="f_${field.id}">${escHtml(val)||'Sera généré automatiquement'}</div>`;
  }
  if (field.type === 'text') {
    return `<input class="field-input" type="text" id="f_${field.id}" value="${escHtml(val)}" oninput="saveVal('${field.id}',this.value);updateProgress()">`;
  }
  if (field.type === 'date') {
    return `<input class="field-input" type="date" id="f_${field.id}" value="${__dateToISO(val)}" onchange="saveVal('${field.id}', __dateFromISO(this.value));updateProgress()">`;
  }
  if (field.type === 'text_dept') {
    return `<input class="field-input" type="text" id="f_${field.id}" value="${escHtml(val)}" maxlength="3" oninput="saveVal('${field.id}',this.value);updateRapNum();updateProgress()">`;
  }
  if (field.type === 'text_rapnum') {
    return `<input class="field-input" type="text" id="f_${field.id}" value="${escHtml(val)}" oninput="saveVal('${field.id}',this.value);updateRapNum();updateProgress()">`;
  }
  if (field.type === 'memo') {
    return `<textarea class="field-input" id="f_${field.id}" oninput="saveVal('${field.id}',this.value);updateProgress()">${escHtml(val)}</textarea>`;
  }
  if (field.type === 'select') {
    const opts = field.options.map(o => `<option ${val===o?'selected':''}>${o}</option>`).join('');
    return `<select class="field-input" id="f_${field.id}" onchange="saveVal('${field.id}',this.value);updateProgress()"><option value="">— Choisir —</option>${opts}</select>`;
  }
  if (field.type === 'yesno') {
    return `<div class="yesno">
      <label><input type="radio" name="f_${field.id}" value="Oui" ${val==='Oui'?'checked':''} onchange="saveVal('${field.id}','Oui');updateProgress()"><span>✔ Oui</span></label>
      <label><input type="radio" name="f_${field.id}" value="Non" ${val==='Non'?'checked':''} onchange="saveVal('${field.id}','Non');updateProgress()"><span>✘ Non</span></label>
    </div>`;
  }
  return '';
}

function renderPhotoCard(label, num) {
  const pid = photoId(label);

  card.id = `pcard-${pid}`;

    <div class="photo-card-header">
      <span class="photo-num">${String(num).padStart(2,'0')}</span>
      <span class="photo-label">${label}</span>
      <span class="photo-status" id="pstatus-${pid}">En attente</span>
    </div>
    <img class="photo-preview" id="pimg-${pid}" src="" alt="">
    <div class="photo-placeholder" id="pph-${pid}">
      <span class="ph-icon">📷</span>
      <span>Aucune photo</span>
    </div>
    <div class="photo-actions">
      <input type="file" accept="image/*" capture="environment" class="photo-file-input" id="pinput-cam-${pid}" onchange="handlePhoto('${label}',this)">
      <input type="file" accept="image/*" class="photo-file-input" id="pinput-gal-${pid}" onchange="handlePhoto('${label}',this)">

      <button class="btn-photo" onclick="document.getElementById('pinput-gal-${pid}').click()">🖼 Choisir depuis la galerie</button>
      <div class="photo-actions-row">
        <button class="btn-photo" id="pbtn-annotate-${pid}" style="display:none" onclick="openAnnotate('${label}')">✏️ Annoter</button>
        <button class="btn-photo danger" id="pbtn-delete-${pid}" style="display:none" onclick="deletePhoto('${label}')">🗑 Effacer</button>
      </div>

function switchPage(idx) {
  allPages.forEach((id, i) => {
    document.getElementById(`page-${id}`)?.classList.toggle('active', i === idx);
    document.getElementById(`nav-${id}`)?.classList.toggle('active', i === idx);
  });
  currentPage = idx;
  updateProgress();
}

/* ═══════════════════════════════════════════
   PROGRESS
═══════════════════════════════════════════ */
function updateProgress() {
  let total = 0, filled = 0;
  SECTIONS.forEach(s => s.groups.forEach(g => g.fields.forEach(f => {
    if (f.type === 'photo') return;
    total++;
    const v = loadVal(f.id);
    if (v && v.trim()) filled++;
  })));
  const pct = total > 0 ? Math.round(filled / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = pct + '%';
  updateConditionalFields();
}

/* ═══════════════════════════════════════════
   PHOTOS
═══════════════════════════════════════════ */
function photoId(label) {
  return label.replace(/[^a-zA-Z0-9]/g,'_');
}

function handlePhoto(label, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    setPhoto(label, e.target.result);
    showToast(`✔ Photo "${label}" enregistrée`);
  };
  reader.readAsDataURL(file);
}

function showPhoto(label, dataUrl) {
  const pid = photoId(label);
  const img = document.getElementById(`pimg-${pid}`);
  const ph  = document.getElementById(`pph-${pid}`);
  const st  = document.getElementById(`pstatus-${pid}`);
  const card= document.getElementById(`pcard-${pid}`);
  const btnAnnotate = document.getElementById(`pbtn-annotate-${pid}`);
  const btnDelete   = document.getElementById(`pbtn-delete-${pid}`);
  if (img) { img.src = dataUrl; img.classList.add('visible'); }
  if (ph)  ph.classList.add('hidden');
  if (st)  { st.textContent = '✔ OK'; st.className = 'photo-status done'; }
  if (card) card.classList.add('has-photo');
  if (btnAnnotate) btnAnnotate.style.display = 'block';
  if (btnDelete)   btnDelete.style.display = 'block';
  updatePhotoBadge();
}

/* Enregistre une nouvelle photo (caméra, galerie...) comme référence "originale",
   ce qui permet de repartir d'une base propre à chaque nouvelle annotation. */
function setPhoto(label, dataUrl) {
  const comment = photoData[label]?.comment || '';
  photoData[label] = { dataUrl, original: dataUrl, comment };
  showPhoto(label, dataUrl);
  savePhotos();
}

function deletePhoto(label) {
  if (!photoData[label]?.dataUrl) return;
  if (!confirm(`Supprimer la photo "${label}" ?`)) return;

  delete photoData[label].dataUrl;
  delete photoData[label].original;
  savePhotos();

  const pid = photoId(label);
  const img = document.getElementById(`pimg-${pid}`);
  const ph  = document.getElementById(`pph-${pid}`);
  const st  = document.getElementById(`pstatus-${pid}`);
  const card= document.getElementById(`pcard-${pid}`);
  const btnAnnotate = document.getElementById(`pbtn-annotate-${pid}`);
  const btnDelete   = document.getElementById(`pbtn-delete-${pid}`);
  if (img) { img.src = ''; img.classList.remove('visible'); }
  if (ph)  ph.classList.remove('hidden');
  if (st)  { st.textContent = 'En attente'; st.className = 'photo-status'; }
  if (card) card.classList.remove('has-photo');
  if (btnAnnotate) btnAnnotate.style.display = 'none';
  if (btnDelete)   btnDelete.style.display = 'none';
  updatePhotoBadge();
  showToast(`🗑 Photo "${label}" supprimée`);
}

function savePhotoComment(label, val) {
  if (!photoData[label]) photoData[label] = {};
  photoData[label].comment = val;
  savePhotos();
}

function updatePhotoBadge() {
  const count = Object.keys(photoData).filter(k => photoData[k]?.dataUrl).length;
  const badge = document.getElementById('badge-photos');
  if (badge) { badge.textContent = count; badge.classList.toggle('show', count > 0); }
}

  document.getElementById('camera-actions-live').style.display = 'flex';
  document.getElementById('camera-actions-preview').style.display = 'none';
  document.getElementById('modal-camera').classList.add('show');

  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('getUserMedia non supporté');
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = cameraStream;
  } catch (err) {
    // Repli : sélecteur natif avec attribut capture (ouvre l'appareil photo du système)
    document.getElementById('modal-camera').classList.remove('show');
    const pid = photoId(label);
    document.getElementById(`pinput-cam-${pid}`)?.click();
  }
}

function stopCameraStream() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

function closeCamera() {
  stopCameraStream();
  document.getElementById('modal-camera').classList.remove('show');
  cameraLabel = null;
  cameraCapturedDataUrl = null;
}

function captureCameraPhoto() {
  const video  = document.getElementById('camera-video');
  const canvas = document.getElementById('camera-canvas');
  if (!video.videoWidth) return;

  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  cameraCapturedDataUrl = canvas.toDataURL('image/jpeg', 0.9);

  const preview = document.getElementById('camera-preview');
  preview.src = cameraCapturedDataUrl;
  preview.classList.add('visible');
  video.style.display = 'none';
  document.getElementById('camera-actions-live').style.display = 'none';
  document.getElementById('camera-actions-preview').style.display = 'flex';

  stopCameraStream(); // fige sur la capture, libère la caméra pendant l'aperçu
}

function retakeCameraPhoto() {
  const video   = document.getElementById('camera-video');
  const preview = document.getElementById('camera-preview');
  cameraCapturedDataUrl = null;
  preview.classList.remove('visible');
  video.style.display = 'block';
  document.getElementById('camera-actions-live').style.display = 'flex';
  document.getElementById('camera-actions-preview').style.display = 'none';

  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
    .then(stream => { cameraStream = stream; video.srcObject = stream; })
    .catch(() => closeCamera());
}

function confirmCameraPhoto() {
  if (!cameraLabel || !cameraCapturedDataUrl) return;
  setPhoto(cameraLabel, cameraCapturedDataUrl);
  showToast(`✔ Photo "${cameraLabel}" enregistrée`);
  closeCamera();
}

/* ═══════════════════════════════════════════
   ANNOTATION DE PHOTO (DESSIN)
═══════════════════════════════════════════ */
let annotateLabel = null;
let annotateCtx = null;
let annotateDrawing = false;
let annotateLast = null;
let annotateColor = '#e24c18';

function scaledDims(w, h, maxDim) {
  if (Math.max(w, h) <= maxDim) return { w, h };
  const scale = maxDim / Math.max(w, h);
  return { w: Math.round(w * scale), h: Math.round(h * scale) };
}

function setDrawColor(color) {
  annotateColor = color;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.toggle('active', d.dataset.color === color));
}

function openAnnotate(label) {
  const entry = photoData[label];
  if (!entry?.dataUrl) return;
  annotateLabel = label;
  document.getElementById('modal-annotate').classList.add('show');
  setDrawColor(annotateColor);

  const img = new Image();
  img.onload = () => {
    const { w, h } = scaledDims(img.naturalWidth, img.naturalHeight, 1600);
    const canvas = document.getElementById('annotate-canvas');
    canvas.width = w;
    canvas.height = h;
    annotateCtx = canvas.getContext('2d');
    annotateCtx.drawImage(img, 0, 0, w, h);
    bindAnnotateEvents(canvas);
  };
  // Repart de la version brute si elle existe, pour permettre de ré-annoter proprement
  img.src = entry.original || entry.dataUrl;
}

function bindAnnotateEvents(canvas) {
  canvas.onpointerdown = e => {
    annotateDrawing = true;
    annotateLast = getCanvasPos(canvas, e);
  };
  canvas.onpointermove = e => {
    if (!annotateDrawing || !annotateCtx) return;
    const pos = getCanvasPos(canvas, e);
    annotateCtx.strokeStyle = annotateColor;
    annotateCtx.lineWidth = Math.max(3, canvas.width / 200);
    annotateCtx.lineCap = 'round';
    annotateCtx.lineJoin = 'round';
    annotateCtx.beginPath();
    annotateCtx.moveTo(annotateLast.x, annotateLast.y);
    annotateCtx.lineTo(pos.x, pos.y);
    annotateCtx.stroke();
    annotateLast = pos;
  };
  const stopDrawing = () => { annotateDrawing = false; annotateLast = null; };
  canvas.onpointerup = stopDrawing;
  canvas.onpointerleave = stopDrawing;
  canvas.onpointercancel = stopDrawing;
}

function getCanvasPos(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function clearAnnotations() {
  if (!annotateLabel || !annotateCtx) return;
  const entry = photoData[annotateLabel];
  const canvas = document.getElementById('annotate-canvas');
  const img = new Image();
  img.onload = () => {
    annotateCtx.clearRect(0, 0, canvas.width, canvas.height);
    annotateCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.src = entry.original || entry.dataUrl;
}

function closeAnnotate() {
  document.getElementById('modal-annotate').classList.remove('show');
  annotateLabel = null;
  annotateCtx = null;
}

function saveAnnotation() {
  if (!annotateLabel || !annotateCtx) return;
  const canvas = document.getElementById('annotate-canvas');
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  if (!photoData[annotateLabel].original) {
    photoData[annotateLabel].original = photoData[annotateLabel].dataUrl;
  }
  photoData[annotateLabel].dataUrl = dataUrl;
  showPhoto(annotateLabel, dataUrl);
  savePhotos();
  showToast(`✔ Annotation enregistrée pour "${annotateLabel}"`);
  closeAnnotate();
}

const __params = new URLSearchParams(location.search);
const DOC_ID = __params.get('doc') || 'standalone';
const PROJECT_ID = __params.get('project') || '';
const DOC_LABEL = __params.get('label') || '';
const PFX = 'doc_' + DOC_ID + '_';
function goBackToProject(){
  location.href = PROJECT_ID ? ('index.html?project='+encodeURIComponent(PROJECT_ID)) : 'index.html';
}
document.addEventListener('DOMContentLoaded', ()=>{
  const lbl=document.getElementById('doc-context-label');

});

/* ═══════════════════════════════════════════
   LOCALSTORAGE
═══════════════════════════════════════════ */
function saveVal(id, val) {
  try { localStorage.setItem(PFX + id, val); } catch(e){}
}
function loadVal(id) {
  try {
    const v = localStorage.getItem(PFX + id);
    if (v !== null) return v;
  } catch(e){}
  // default
  const allFields = SECTIONS.flatMap(s=>s.groups.flatMap(g=>g.fields));
  const f = allFields.find(x=>x.id===id);
  return f?.default || '';
}
function savePhotos() {
  try { localStorage.setItem(PFX+'photos', JSON.stringify(photoData)); } catch(e){}
}
function loadPhotos() {
  try {
    const raw = localStorage.getItem(PFX+'photos');
    if (raw) Object.assign(photoData, JSON.parse(raw));
  } catch(e){}
}

/* ═══════════════════════════════════════════
   EXPORT PDF
═══════════════════════════════════════════ */
/* ═══════════════════════════════════════════
   EXPORT PDF (génération directe, sans passer par
   l'impression du navigateur — plus fiable sur mobile)
═══════════════════════════════════════════ */
function __loadImageDims(dataUrl){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve({ w: 0, h: 0 });
    img.src = dataUrl;
  });
}

async function exportPDF() {
  showToast('📄 Génération du PDF en cours…', 4000);
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = 210, pageH = 297;
    const marginX = 15;
    const contentW = pageW - marginX * 2;
    const bottomLimit = pageH - 15;
    let y = 20;

    const checkBreak = (needed) => {
      if (y + needed > bottomLimit) { doc.addPage(); y = 20; }
    };

    const proj = loadVal('projet_nom') || '\u2014';
    const tech = loadVal('technicien') || '\u2014';
    const date = loadVal('date') || new Date().toLocaleDateString('fr-FR');
    const rapnum = buildRapNum() || '\u2014';

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.setTextColor(16, 77, 94);
    doc.text('RAPPORT VISITE TECHNIQUE', marginX, y);
    y += 6;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(85, 85, 85);
    doc.text(`N° : ${rapnum}`, marginX, y);
    y += 5;
    doc.text(`Projet : ${proj}   |   Technicien : ${tech}   |   Date : ${date}`, marginX, y);
    y += 4;
    doc.setDrawColor(16, 77, 94);
    doc.setLineWidth(0.6);
    doc.line(marginX, y, pageW - marginX, y);
    y += 8;

    for (const section of SECTIONS) {
      for (const group of section.groups) {
        checkBreak(10);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(16, 77, 94);
        doc.text(`${section.title} \u2014 ${group.title}`, marginX, y);
        y += 3;
        doc.setDrawColor(210, 210, 210);
        doc.setLineWidth(0.2);
        doc.line(marginX, y, pageW - marginX, y);
        y += 5;

        for (const field of group.fields) {
          if (field.type === 'photo') {
            const v = photoData[field.label];
            if (!v || !v.dataUrl) continue;
            const dims = await __loadImageDims(v.dataUrl);
            let imgW = 80, imgH = 60;
            if (dims.w && dims.h) {
              imgW = Math.min(contentW, 80); imgH = imgW * (dims.h / dims.w);
              if (imgH > 65) { imgH = 65; imgW = imgH * (dims.w / dims.h); }
            }
            checkBreak(imgH + 12);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9);
            doc.setTextColor(60, 60, 60);
            doc.text(`📷 ${field.label}`, marginX, y);
            y += 4;
            try {
              const fmt = v.dataUrl.startsWith('data:image/png') ? 'PNG' : 'JPEG';
              doc.addImage(v.dataUrl, fmt, marginX, y, imgW, imgH);
              y += imgH + 2;
            } catch (e) {
              doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5);
              doc.text('(photo non intégrée)', marginX, y); y += 5;
            }
            if (v.comment) {
              doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(80, 80, 80);
              const cLines = doc.splitTextToSize(`Commentaire : ${v.comment}`, contentW);
              checkBreak(cLines.length * 4);
              doc.text(cLines, marginX, y);
              y += cLines.length * 4;
            }
            y += 4;
            continue;
          }
          const raw = loadVal(field.id);
          const val = (raw && String(raw).trim()) ? String(raw) : '\u2014';
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9);
          doc.setTextColor(60, 60, 60);
          const labelText = field.label + ' :';
          doc.text(labelText, marginX, y);
          const labelW = doc.getTextWidth(labelText);

          doc.setFont('helvetica', 'normal');
          doc.setTextColor(15, 15, 15);
          const valX = marginX + Math.min(labelW + 3, 70);
          const valW = contentW - (valX - marginX);
          const lines = doc.splitTextToSize(val, valW);
          checkBreak(lines.length * 4.3 + 2);
          // re-draw label after potential page break
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(60, 60, 60);
          doc.text(labelText, marginX, y);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(15, 15, 15);
          doc.text(lines, valX, y);
          y += Math.max(lines.length * 4.3, 4.3) + 1.8;
        }
        y += 3;
      }
    }

    const filename = `RapportVT_${rapnum.replace(/[^a-zA-Z0-9-]/g, '_')}.pdf`;
    doc.save(filename);
    showToast('✔ PDF généré : ' + filename, 3500);
  } catch (e) {
    console.error(e);
    showToast('\u274c Erreur lors de la génération du PDF : ' + e.message, 6000);
  }
}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
function showToast(msg, duration=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), duration);
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════
   NUMÉRO DE RAPPORT
═══════════════════════════════════════════ */
function getNextRapNum() {
  try {
    const n = parseInt(localStorage.getItem(PFX+'rapnum_counter') || '0') + 1;
    return n;
  } catch(e) { return 1; }
}
function saveRapCounter(n) {
  try { localStorage.setItem(PFX+'rapnum_counter', String(n)); } catch(e) {}
}
function buildRapNum() {
  const dept  = (loadVal('dept') || '').trim().replace(/[^a-zA-Z0-9]/g,'').toUpperCase().substring(0,3);
  const proj  = (loadVal('projet_nom') || '').trim().replace(/[^a-zA-Z0-9]/g,'').toUpperCase().substring(0,12);
  const num   = String(parseInt(localStorage.getItem(PFX+'rapnum_counter') || '1')).padStart(2,'0');
  const parts = [dept, proj, 'RAPVT', num].filter(Boolean);
  return parts.join(' - ');
}
function updateRapNum() {
  const val = buildRapNum();
  saveVal('rapport_num', val);
  const el = document.getElementById('f_rapport_num');
  if (el) el.textContent = val || 'Sera généré automatiquement';
}

/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
function confirmReset() {
  document.getElementById('modal-reset').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-reset').classList.remove('show');
}
function doReset() {
  // increment counter before clearing
  const currentNum = parseInt(localStorage.getItem(PFX+'rapnum_counter') || '0') + 1;
  saveRapCounter(currentNum);

  // clear all form values except counter and dept (keep dept for convenience)
  const keepDept = loadVal('dept');
  const allKeys = Object.keys(localStorage).filter(k => k.startsWith(PFX) && k !== PFX+'rapnum_counter');
  allKeys.forEach(k => localStorage.removeItem(k));

  // restore dept
  if (keepDept) saveVal('dept', keepDept);

  // clear photo data
  Object.keys(photoData).forEach(k => delete photoData[k]);

  closeModal();

  // rebuild UI
  document.getElementById('content').innerHTML = '';
  document.getElementById('nav').innerHTML = '';
  buildNav();
  buildContent();
  switchPage(0);

  // set new rapnum
  localStorage.setItem(PFX+'rapnum_counter', String(currentNum));
  updateRapNum();
  updateProgress();
  updatePhotoBadge();

  showToast(`✔ Nouveau rapport — N° ${currentNum.toString().padStart(2,'0')}`);
}

/* ═══════════════════════════════════════════
   PRÉ-REMPLISSAGE DEPUIS LE PROJET
   Note : dans ce document, le champ "type_projet" correspond en réalité
   au TYPE D'INSTALLATION (Toiture/Ombrière/Sol/Autre), et le champ
   "utilisation" correspond au TYPE DE PROJET (Autoconsommation/Vente
   totale...) — c'est inversé par rapport aux autres documents.
═══════════════════════════════════════════ */
function __seedFromProject(){
  const map = {
    projet_nom:   __params.get('p_nom'),
    client_nom:   __params.get('p_client'),
    localisation: __params.get('p_localisation'),
    puissance:    __params.get('p_puissance'),
    utilisation:  __params.get('p_type_projet'),
    type_projet:  __params.get('p_type_installation'),
  };
  Object.entries(map).forEach(([key,val])=>{
    if(val && !loadVal(key)) saveVal(key,val);
  });
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
(function init() {
  __seedFromProject();
  loadPhotos();
  buildNav();
  buildContent();
  switchPage(0);
  updateProgress();
  updatePhotoBadge();

  // restore photo UI
  PHOTOS.forEach(label => {
    if (photoData[label]?.dataUrl) {
      showPhoto(label, photoData[label].dataUrl);
      const pid = photoId(label);
      const commentEl = document.getElementById(`pcomment-${pid}`);
      if (commentEl) commentEl.value = photoData[label].comment || '';
    }
  });

  // init counter if first time
  if (!localStorage.getItem(PFX+'rapnum_counter')) {
    localStorage.setItem(PFX+'rapnum_counter', '1');
  }
  updateRapNum();

  showToast('📋 Formulaire chargé — données sauvegardées automatiquement');
})();
</script>
