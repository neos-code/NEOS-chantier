<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEOS Chantier</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --panel:#181c28; --card:#1e2335; --border:#2a3050;
  --accent:#f0b429; --accent2:#38bdf8; --ok:#34d399; --danger:#f87171;
  --text:#e2e8f0; --muted:#64748b; --radius:10px; --shadow:0 4px 24px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-title{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;color:var(--accent);letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.btn{padding:9px 16px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn-accent{background:var(--accent);color:#000}
.btn-accent:hover{opacity:.85}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-danger-outline{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn-danger-outline:hover{background:rgba(248,113,113,.1)}

.content{padding:24px;max-width:920px;margin:0 auto}

/* ═ PROJECT LIST ═ */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px}
.project-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:border-color .15s}
.project-card:hover{border-color:var(--accent2)}
.project-card h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:var(--text);margin-bottom:6px}
.project-card p{font-size:.78rem;color:var(--muted);margin-bottom:3px}
.project-card .doc-count{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.68rem;font-family:'DM Mono',monospace;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:3px 9px;color:var(--accent2)}

.empty-state{text-align:center;padding:60px 24px;color:var(--muted)}
.empty-state .es-icon{font-size:2.8rem;margin-bottom:14px;opacity:.4}
.empty-state p{font-size:.88rem;margin-bottom:16px}

/* ═ PROJECT DETAIL ═ */
.project-header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.project-header h2{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--accent);margin-bottom:8px}
.project-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:14px}
.project-meta b{color:var(--text);font-weight:500}
.project-header-actions{display:flex;gap:8px}

.doc-type-section{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.doc-type-header{padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(56,189,248,.05);display:flex;align-items:center;justify-content:space-between}
.doc-type-header h3{font-family:'Syne',sans-serif;font-size:.92rem;font-weight:700;color:var(--accent2);display:flex;align-items:center;gap:8px}
.doc-list{padding:8px}
.doc-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;transition:background .15s}
.doc-item:hover{background:var(--bg)}
.doc-item-info{display:flex;flex-direction:column;gap:2px;cursor:pointer;flex:1}
.doc-item-label{font-size:.85rem;font-weight:500}
.doc-item-date{font-size:.72rem;color:var(--muted);font-family:'DM Mono',monospace}
.doc-item-actions{display:flex;gap:6px}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;transition:all .15s}
.icon-btn:hover{border-color:var(--danger);color:var(--danger)}
.doc-empty{padding:14px 18px;font-size:.78rem;color:var(--muted)}
.actions-table{width:100%;border-collapse:collapse;font-size:.8rem}
.actions-table th{text-align:left;padding:10px 14px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border)}
.actions-table td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
.actions-table tr:last-child td{border-bottom:none}
.action-source{color:var(--muted);font-size:.74rem;white-space:nowrap}
.action-status-select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.76rem;padding:5px 8px;outline:none}
.action-status-select.action-status-done{border-color:var(--ok);color:var(--ok)}
.action-status-select.action-status-progress{border-color:var(--accent2);color:var(--accent2)}
.action-status-select.action-status-todo{border-color:var(--muted);color:var(--muted)}

/* ═ MODAL ═ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px;max-width:400px;width:100%}
.modal-box h2{font-family:'Syne',sans-serif;font-size:1.05rem;color:var(--text);margin-bottom:16px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.modal-field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;padding:9px 11px;outline:none}
.modal-field input:focus{border-color:var(--accent)}
.modal-field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;padding:9px 11px;outline:none}
.modal-field select:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

.toast{position:fixed;bottom:20px;right:20px;left:20px;max-width:340px;margin:0 auto;background:var(--card);border:1px solid var(--ok);color:var(--ok);padding:10px 18px;border-radius:8px;font-size:.83rem;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:all .22s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}

@media(min-width:600px){.toast{left:auto}}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title"><span id="back-arrow" style="display:none;cursor:pointer" onclick="showProjectList()">←</span> ☀️ NEOS Chantier</span>
  <button class="btn btn-accent" id="btn-new-project" onclick="openNewProjectModal()">+ Nouveau projet</button>
</div>

<div class="content" id="content"></div>

<!-- MODAL: nouveau projet -->
<div class="modal-overlay" id="modal-project">
  <div class="modal-box">
    <h2>Nouveau projet / chantier</h2>
    <div class="modal-field">
      <label>Nom du projet *</label>
      <input type="text" id="np-nom" placeholder="Ex : Centrale PV Orvault 3">
    </div>
    <div class="modal-field">
      <label>Client</label>
      <input type="text" id="np-client" placeholder="Ex : Mairie d'Orvault">
    </div>
    <div class="modal-field">
      <label>Localisation</label>
      <input type="text" id="np-localisation" placeholder="Ex : Orvault (44)">
    </div>
    <div class="modal-field">
      <label>Puissance prévue (kWc)</label>
      <input type="text" id="np-puissance" placeholder="Ex : 100">
    </div>
    <div class="modal-field">
      <label>Type de projet</label>
      <select id="np-type-projet">
        <option value="">— Choisir —</option>
        <option>Autoconsommation</option>
        <option>Vente totale</option>
        <option>Autoconso + revente surplus</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Type d'installation</label>
      <select id="np-type-installation">
        <option value="">— Choisir —</option>
        <option>Toiture</option>
        <option>Ombrière</option>
        <option>Sol</option>
        <option>Autre</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-project')">Annuler</button>
      <button class="btn btn-accent" onclick="createProject()">Créer</button>
    </div>
  </div>
</div>

<!-- MODAL: nouveau document -->
<div class="modal-overlay" id="modal-doc">
  <div class="modal-box">
    <h2 id="modal-doc-title">Nouveau document</h2>
    <div class="modal-field">
      <label>Libellé (ex : date, semaine, n° de visite)</label>
      <input type="text" id="nd-label" placeholder="Ex : Visite du 12/08/2026">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-doc')">Annuler</button>
      <button class="btn btn-accent" onclick="createDocument()">Créer et ouvrir</button>
    </div>
  </div>
</div>

<!-- MODAL: confirmation suppression -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal-box">
    <h2 id="confirm-text">Confirmer la suppression ?</h2>
    <p style="font-size:.8rem;color:var(--muted);margin-bottom:6px">Cette action est irréversible.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-confirm')">Annuler</button>
      <button class="btn" style="background:var(--danger);color:#fff" id="confirm-btn">Supprimer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══ DOC TYPES CONFIG ═══ */
const DOC_TYPES = [
  { key:'ouverture', icon:'🚧', title:'Rapport d\'ouverture', file:'rapport_ouverture.html' },
  { key:'suivi',     icon:'🏗', title:'Suivi de chantier',    file:'suivi_chantier.html' },
  { key:'vt',        icon:'⚡', title:'Visite technique (VT)', file:'rapport_vt.html' },
  { key:'fermeture', icon:'🏁', title:'Rapport de fermeture',  file:'rapport_fermeture.html' }
];

/* ═══ STORAGE HELPERS ═══ */
function getProjects(){ try{ return JSON.parse(localStorage.getItem('neos_projects')||'[]'); }catch(e){ return []; } }
function saveProjects(p){ localStorage.setItem('neos_projects', JSON.stringify(p)); }
function getDocuments(){ try{ return JSON.parse(localStorage.getItem('neos_documents')||'[]'); }catch(e){ return []; } }
function saveDocuments(d){ localStorage.setItem('neos_documents', JSON.stringify(d)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ═══ TOAST ═══ */
function showToast(msg,d=2400){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),d);
}

/* ═══ MODAL HELPERS ═══ */
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function openModal(id){ document.getElementById(id).classList.add('show'); }

/* ═══ ROUTING ═══ */
function currentProjectId(){
  return new URLSearchParams(location.search).get('project') || null;
}

function showProjectList(){
  history.pushState({}, '', 'index.html');
  render();
}

function openProject(id){
  history.pushState({}, '', 'index.html?project='+encodeURIComponent(id));
  render();
}

window.addEventListener('popstate', render);

/* ═══ RENDER ═══ */
function render(){
  const pid = currentProjectId();
  document.getElementById('back-arrow').style.display = pid ? 'inline' : 'none';
  document.getElementById('btn-new-project').style.display = pid ? 'none' : 'inline-block';
  if(pid) renderProjectDetail(pid);
  else renderProjectList();
}

function renderProjectList(){
  const projects = getProjects();
  const documents = getDocuments();
  const content = document.getElementById('content');
  if(!projects.length){
    content.innerHTML = `
      <div class="empty-state">
        <div class="es-icon">📁</div>
        <p>Aucun projet pour le moment.<br>Crée ton premier chantier pour commencer.</p>
        <button class="btn btn-accent" onclick="openNewProjectModal()">+ Nouveau projet</button>
      </div>`;
    return;
  }
  content.innerHTML = `
    <div class="project-grid">
      ${projects.slice().sort((a,b)=>b.createdAt-a.createdAt).map(p=>{
        const docs = documents.filter(d=>d.projectId===p.id);
        const counts = DOC_TYPES.map(t=>{
          const n = docs.filter(d=>d.type===t.key).length;
          return n ? `<span class="chip">${t.icon} ${n}</span>` : '';
        }).join('');
        return `
        <div class="project-card" onclick="openProject('${p.id}')">
          <h3>${esc(p.nom)}</h3>
          ${p.client ? `<p>👤 ${esc(p.client)}</p>` : ''}
          ${p.localisation ? `<p>📍 ${esc(p.localisation)}</p>` : ''}
          <div class="doc-count">${counts || '<span class="chip">Aucun document</span>'}</div>
        </div>`;
      }).join('')}
    </div>`;
}

function renderProjectDetail(pid){
  const projects = getProjects();
  const project = projects.find(p=>p.id===pid);
  const content = document.getElementById('content');
  if(!project){
    content.innerHTML = `<div class="empty-state"><p>Projet introuvable.</p><button class="btn btn-accent" onclick="showProjectList()">Retour à la liste</button></div>`;
    return;
  }
  const documents = getDocuments().filter(d=>d.projectId===pid);

  content.innerHTML = `
    <div class="project-header">
      <h2>${esc(project.nom)}</h2>
      <div class="project-meta">
        ${project.client ? `<span>👤 Client : <b>${esc(project.client)}</b></span>` : ''}
        ${project.localisation ? `<span>📍 <b>${esc(project.localisation)}</b></span>` : ''}
        <span>📅 Créé le <b>${new Date(project.createdAt).toLocaleDateString('fr-FR')}</b></span>
      </div>
      <div class="project-header-actions">
        <button class="btn btn-danger-outline" onclick="askDeleteProject('${project.id}')">🗑 Supprimer le projet</button>
      </div>
    </div>
    ${renderProjectActionsTable(pid)}
    ${DOC_TYPES.map(t=>renderDocSection(t, documents.filter(d=>d.type===t.key), project)).join('')}
  `;
}

function renderProjectActionsTable(pid){
  const actions = getProjectActions(pid).slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  return `
    <div class="doc-type-section" style="margin-bottom:20px">
      <div class="doc-type-header">
        <h3>📋 Suivi des actions</h3>
      </div>
      ${actions.length ? `
      <div style="overflow-x:auto">
        <table class="actions-table">
          <thead><tr><th>Qui</th><th>Date</th><th>Action</th><th>Statut</th><th>Origine</th></tr></thead>
          <tbody>
            ${actions.map(a=>`
              <tr>
                <td>${esc(a.qui)||'—'}</td>
                <td>${esc(a.date)||'—'}</td>
                <td>${esc(a.action)||'—'}</td>
                <td>
                  <select class="action-status-select action-status-${statusClass(a.statut)}" onchange="updateProjectActionStatus('${pid}','${a.id}',this.value);render()">
                    <option ${a.statut==='À faire'?'selected':''}>À faire</option>
                    <option ${a.statut==='En cours'?'selected':''}>En cours</option>
                    <option ${a.statut==='Fait'?'selected':''}>Fait</option>
                  </select>
                </td>
                <td class="action-source">${esc(a.sourceLabel)||'—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : `<div class="doc-empty">Aucune action pour l'instant — elles apparaîtront ici automatiquement dès qu'un rapport d'ouverture ou de fermeture en contiendra.</div>`}
    </div>`;
}
function statusClass(statut){
  if(statut==='Fait') return 'done';
  if(statut==='En cours') return 'progress';
  return 'todo';
}

function renderDocSection(type, docs, project){
  return `
    <div class="doc-type-section">
      <div class="doc-type-header">
        <h3>${type.icon} ${type.title}</h3>
        <button class="btn btn-ghost" onclick="openNewDocModal('${type.key}','${project.id}')">+ Nouveau</button>
      </div>
      <div class="doc-list">
        ${docs.length ? docs.slice().sort((a,b)=>b.createdAt-a.createdAt).map(d=>`
          <div class="doc-item">
            <div class="doc-item-info" onclick="openDocument('${d.id}')">
              <span class="doc-item-label">${esc(d.label || 'Sans libellé')}</span>
              <span class="doc-item-date">Créé le ${new Date(d.createdAt).toLocaleDateString('fr-FR')} à ${new Date(d.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span>
            </div>
            <div class="doc-item-actions">
              <button class="icon-btn" onclick="askDeleteDocument('${d.id}')" title="Supprimer">✕</button>
            </div>
          </div>
        `).join('') : `<div class="doc-empty">Aucun document de ce type pour l'instant.</div>`}
      </div>
    </div>`;
}

function esc(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ═══ PROJECT CRUD ═══ */
function openNewProjectModal(){
  document.getElementById('np-nom').value='';
  document.getElementById('np-client').value='';
  document.getElementById('np-localisation').value='';
  document.getElementById('np-puissance').value='';
  document.getElementById('np-type-projet').value='';
  document.getElementById('np-type-installation').value='';
  openModal('modal-project');
  setTimeout(()=>document.getElementById('np-nom').focus(),50);
}

function createProject(){
  const nom = document.getElementById('np-nom').value.trim();
  if(!nom){ showToast('⚠ Le nom du projet est obligatoire'); return; }
  const project = {
    id: uid(),
    nom,
    client: document.getElementById('np-client').value.trim(),
    localisation: document.getElementById('np-localisation').value.trim(),
    puissance: document.getElementById('np-puissance').value.trim(),
    typeProjet: document.getElementById('np-type-projet').value,
    typeInstallation: document.getElementById('np-type-installation').value,
    createdAt: Date.now()
  };
  const projects = getProjects();
  projects.push(project);
  saveProjects(projects);
  closeModal('modal-project');
  showToast('✔ Projet créé');
  openProject(project.id);
}

let pendingDeleteProjectId = null;
function askDeleteProject(id){
  pendingDeleteProjectId = id;
  document.getElementById('confirm-text').textContent = 'Supprimer ce projet et tous ses documents ?';
  document.getElementById('confirm-btn').onclick = doDeleteProject;
  openModal('modal-confirm');
}
function doDeleteProject(){
  const id = pendingDeleteProjectId;
  saveProjects(getProjects().filter(p=>p.id!==id));
  const docsToDelete = getDocuments().filter(d=>d.projectId===id);
  docsToDelete.forEach(d=>{
    Object.keys(localStorage).filter(k=>k.startsWith('doc_'+d.id+'_')).forEach(k=>localStorage.removeItem(k));
  });
  saveDocuments(getDocuments().filter(d=>d.projectId!==id));
  saveProjectActions(JSON.parse(localStorage.getItem('neos_project_actions')||'[]').filter(a=>a.projectId!==id));
  closeModal('modal-confirm');
  showToast('✔ Projet supprimé');
  showProjectList();
}

/* ═══ DOCUMENT CRUD ═══ */
let pendingDocType = null, pendingDocProjectId = null;
function openNewDocModal(typeKey, projectId){
  pendingDocType = typeKey;
  pendingDocProjectId = projectId;
  const type = DOC_TYPES.find(t=>t.key===typeKey);
  document.getElementById('modal-doc-title').textContent = 'Nouveau : ' + type.title;
  document.getElementById('nd-label').value = new Date().toLocaleDateString('fr-FR');
  openModal('modal-doc');
  setTimeout(()=>document.getElementById('nd-label').select(),50);
}

function createDocument(){
  const type = DOC_TYPES.find(t=>t.key===pendingDocType);
  const label = document.getElementById('nd-label').value.trim() || type.title;
  const doc = {
    id: uid(),
    projectId: pendingDocProjectId,
    type: pendingDocType,
    label,
    createdAt: Date.now()
  };
  const docs = getDocuments();
  docs.push(doc);
  saveDocuments(docs);
  seedActionsIntoDocument(doc);
  closeModal('modal-doc');
  openDocument(doc.id);
}

/* ═══ TABLEAU D'ACTIONS PROJET ═══ */
function getProjectActions(projectId){
  try{ return JSON.parse(localStorage.getItem('neos_project_actions')||'[]').filter(a=>a.projectId===projectId); }
  catch(e){ return []; }
}
function saveProjectActions(all){
  localStorage.setItem('neos_project_actions', JSON.stringify(all));
}
function seedActionsIntoDocument(doc){
  if(doc.type !== 'fermeture' && doc.type !== 'suivi') return;
  const projectActions = getProjectActions(doc.projectId);
  if(!projectActions.length) return;
  const pfx = 'doc_'+doc.id+'_';
  if(doc.type === 'fermeture'){
    const rows = projectActions.map(a=>({ qui:a.qui, date:a.date, action:a.action }));
    localStorage.setItem(pfx+'action_rows', JSON.stringify(rows));
  } else if(doc.type === 'suivi'){
    const rows = projectActions.map((a,i)=>({
      id: Date.now()+i, date:a.date, qui:a.qui, quoi:a.action, statut:'attente', photos:[]
    }));
    localStorage.setItem(pfx+'actions', JSON.stringify(rows));
  }
}
function updateProjectActionStatus(projectId, actionId, statut){
  const all = JSON.parse(localStorage.getItem('neos_project_actions')||'[]');
  const item = all.find(a=>a.id===actionId);
  if(item){ item.statut = statut; saveProjectActions(all); }
}

function openDocument(docId){
  const doc = getDocuments().find(d=>d.id===docId);
  if(!doc) return;
  const type = DOC_TYPES.find(t=>t.key===doc.type);
  const project = getProjects().find(p=>p.id===doc.projectId);
  const params = new URLSearchParams({
    project: doc.projectId,
    doc: doc.id,
    label: doc.label
  });
  if(project){
    if(project.nom) params.set('p_nom', project.nom);
    if(project.client) params.set('p_client', project.client);
    if(project.localisation) params.set('p_localisation', project.localisation);
    if(project.puissance) params.set('p_puissance', project.puissance);
    if(project.typeProjet) params.set('p_type_projet', project.typeProjet);
    if(project.typeInstallation) params.set('p_type_installation', project.typeInstallation);
  }
  const url = `${type.file}?${params.toString()}`;
  location.href = url;
}

let pendingDeleteDocId = null;
function askDeleteDocument(id){
  pendingDeleteDocId = id;
  document.getElementById('confirm-text').textContent = 'Supprimer ce document ?';
  document.getElementById('confirm-btn').onclick = doDeleteDocument;
  openModal('modal-confirm');
}
function doDeleteDocument(){
  const id = pendingDeleteDocId;
  Object.keys(localStorage).filter(k=>k.startsWith('doc_'+id+'_')).forEach(k=>localStorage.removeItem(k));
  saveDocuments(getDocuments().filter(d=>d.id!==id));
  saveProjectActions(JSON.parse(localStorage.getItem('neos_project_actions')||'[]').filter(a=>a.sourceDocId!==id));
  closeModal('modal-confirm');
  showToast('✔ Document supprimé');
  render();
}

/* ═══ INIT ═══ */
render();

/* ═══ SERVICE WORKER (PWA offline) ═══ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
