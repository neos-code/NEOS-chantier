<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<title>Rapport Fermeture Chantier</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0f1117;
  --panel:     #181c28;
  --card:      #1e2335;
  --border:    #2a3050;
  --accent:    #f0b429;
  --accent2:   #38bdf8;
  --ok:        #34d399;
  --danger:    #f87171;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --radius:    10px;
  --shadow:    0 4px 24px rgba(0,0,0,.4);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ═══ LAYOUT ═══ */
.app { display: flex; flex: 1; overflow: hidden; height: 100vh; }

.sidebar {
  width: 230px; min-width: 230px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
}
.sidebar-logo { padding: 28px 20px 20px; border-bottom: 1px solid var(--border); }
.sidebar-logo h1 { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 800; color: var(--accent); letter-spacing: -.5px; }
.sidebar-logo p { font-size: .72rem; color: var(--muted); margin-top: 3px; }

.nav { padding: 12px 10px; flex: 1; }
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 12px; border: none;
  background: transparent; color: var(--muted);
  font-family: 'DM Sans', sans-serif; font-size: .82rem; font-weight: 500;
  border-radius: 7px; cursor: pointer; text-align: left; transition: all .15s;
}
.nav-btn:hover { background: var(--card); color: var(--text); }
.nav-btn.active { background: var(--card); color: var(--accent); }
.nav-icon { font-size: 1rem; width: 20px; text-align: center; }

.sidebar-footer { padding: 14px 10px; border-top: 1px solid var(--border); }
.btn-back {
  width: 100%; padding: 10px;
  background: transparent; color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); font-family: 'Syne', sans-serif;
  font-size: .8rem; font-weight: 700; cursor: pointer; margin-bottom: 8px;
  transition: all .15s;
}
.btn-back:hover { border-color: var(--accent2); color: var(--accent2); }
.btn-export {
  width: 100%; padding: 11px;
  background: var(--accent); color: #000; border: none;
  border-radius: var(--radius); font-family: 'Syne', sans-serif;
  font-size: .85rem; font-weight: 700; cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn-export:hover { opacity: .88; transform: translateY(-1px); }
.btn-reset {
  width: 100%; margin-top: 8px; padding: 9px;
  background: transparent; color: var(--danger);
  border: 1px solid var(--danger); border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: .78rem; font-weight: 700;
  cursor: pointer; transition: all .15s;
}
.btn-reset:hover { background: rgba(248,113,113,.1); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 56px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.topbar-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text); }
.progress-wrap { display: flex; align-items: center; gap: 10px; }
.progress-bar { width: 180px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; width: 0%; }
.progress-label { font-size: .75rem; color: var(--muted); font-family: 'DM Mono', monospace; }

.content { flex: 1; overflow-y: auto; padding: 28px 32px; }
.page { display: none; }
.page.active { display: block; }

/* ═══ CARDS ═══ */
.section-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 20px; overflow: hidden;
}
.section-card-header {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  background: rgba(56,189,248,.06);
}
.section-card-header h3 { font-family: 'Syne', sans-serif; font-size: .95rem; font-weight: 700; color: var(--accent2); }
.section-card-body { padding: 18px 20px; }

.field-row {
  display: grid; grid-template-columns: 220px 1fr;
  align-items: start; gap: 10px 16px; padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.field-row:last-child { border-bottom: none; }
.field-label { font-size: .82rem; color: var(--muted); padding-top: 8px; font-weight: 500; }
.field-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'DM Mono', monospace;
  font-size: .82rem; padding: 7px 11px; outline: none; transition: border-color .15s;
}
.field-input:focus { border-color: var(--accent); }
textarea.field-input { resize: vertical; min-height: 80px; }
select.field-input { cursor: pointer; }
select.field-input option { background: var(--card); }

/* rapnum */
.rapnum-display {
  background: var(--bg); border: 1px solid var(--accent); border-radius: 7px;
  color: var(--accent); font-family: 'DM Mono', monospace;
  font-size: .88rem; font-weight: 500; padding: 7px 11px;
  letter-spacing: .5px; user-select: all;
}

/* ═══ PARTICIPANTS ═══ */
.participants-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
}
.participant-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
}
.participant-card label { font-size: .72rem; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 500; }
.participant-card textarea {
  width: 100%; background: transparent; border: none;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .8rem;
  resize: none; outline: none; min-height: 60px; line-height: 1.5;
}

/* ═══ RETOUR OUVRAGE ═══ */
.retour-row {
  display: grid; grid-template-columns: 160px auto auto 1fr;
  align-items: center; gap: 10px 14px; padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
  flex-wrap: wrap;
}
.retour-row .reserve-action-block {
  grid-column: 1 / -1;
}
.retour-row:last-child { border-bottom: none; }
.retour-label { font-size: .85rem; font-weight: 500; color: var(--text); }
.ras-btn, .reserve-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-size: .8rem;
  cursor: pointer; transition: all .12s; font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
}
.ras-btn:hover { border-color: var(--ok); color: var(--ok); }
.reserve-btn:hover { border-color: var(--danger); color: var(--danger); }
.ras-btn.active { border-color: var(--ok); color: var(--ok); background: rgba(52,211,153,.1); }
.reserve-btn.active { border-color: var(--danger); color: var(--danger); background: rgba(248,113,113,.1); }
.retour-comment {
  background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .8rem;
  padding: 6px 10px; outline: none; width: 100%; transition: border-color .15s;
}
.retour-comment:focus { border-color: var(--accent2); }
.checkbox-pair { display: flex; gap: 8px; }

/* ═══ ACTIONS TABLE ═══ */
.actions-table { width: 100%; border-collapse: collapse; }
.actions-table th {
  text-align: left; font-size: .78rem; color: var(--muted); font-weight: 600;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .5px;
}
.actions-table td { padding: 6px 4px; }
.actions-table input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .82rem;
  padding: 7px 10px; outline: none; transition: border-color .15s;
}
.actions-table input:focus { border-color: var(--accent); }
.btn-add-row {
  margin-top: 10px; padding: 7px 16px; background: transparent;
  border: 1px dashed var(--border); border-radius: 7px; color: var(--muted);
  font-size: .8rem; cursor: pointer; transition: all .15s; width: 100%;
}
.btn-add-row:hover { border-color: var(--accent2); color: var(--accent2); }
.btn-del-row {
  background: transparent; border: none; color: var(--danger);
  font-size: 1rem; cursor: pointer; padding: 4px 8px; border-radius: 4px;
  transition: opacity .15s; opacity: .5;
}
.btn-del-row:hover { opacity: 1; }

/* ═══ RESERVE ACTION INLINE ═══ */
.reserve-action-block {
  display: none;
  margin-top: 8px;
  padding: 10px 14px;
  background: rgba(248,113,113,.07);
  border: 1px solid rgba(248,113,113,.3);
  border-radius: 8px;
  grid-column: 1 / -1;
}
.reserve-action-block.visible { display: block; }
.reserve-action-title {
  font-size: .72rem; color: var(--danger); font-weight: 600;
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;
  font-family: 'DM Mono', monospace;
}
.reserve-action-fields {
  display: grid; grid-template-columns: 1fr 140px 2fr;
  gap: 8px;
}
.reserve-action-fields input {
  background: var(--bg); border: 1px solid rgba(248,113,113,.4);
  border-radius: 6px; color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: .8rem; padding: 6px 10px; outline: none; transition: border-color .15s;
  width: 100%;
}
.reserve-action-fields input:focus { border-color: var(--danger); }
.reserve-action-fields input::placeholder { color: var(--muted); }
@media (max-width: 600px) {
  .reserve-action-fields { grid-template-columns: 1fr; }
}
@media print {
  .reserve-action-block.visible { background: #fff8f8 !important; border-color: #d04040 !important; }
  .reserve-action-fields input { background: #fafafa !important; border: 1px solid #ccc !important; color: #111 !important; }
}

/* ═══ TOAST ═══ */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--card); border: 1px solid var(--ok); color: var(--ok);
  padding: 12px 20px; border-radius: 9px; font-size: .85rem; font-weight: 500;
  box-shadow: var(--shadow); z-index: 9999; opacity: 0;
  transform: translateY(12px); transition: all .25s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ═══ MODAL ═══ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.7); z-index: 10000;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 32px 28px; max-width: 380px; width: 90%;
  text-align: center; box-shadow: var(--shadow);
}
.modal-box h2 { font-family: 'Syne', sans-serif; font-size: 1.1rem; color: var(--text); margin-bottom: 10px; }
.modal-box p { font-size: .85rem; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; justify-content: center; }
.modal-btn { padding: 10px 22px; border: none; border-radius: 8px; font-family: 'Syne', sans-serif; font-size: .85rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
.modal-btn:hover { opacity: .85; }
.modal-btn.cancel { background: var(--border); color: var(--text); }
.modal-btn.confirm { background: var(--danger); color: #fff; }

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 900px) {
  .sidebar { width: 56px; min-width: 56px; }
  .sidebar-logo { padding: 14px 8px; text-align: center; }
  .sidebar-logo p { display: none; }
  .nav { padding: 8px 6px; }
  .nav-btn { padding: 10px 0; justify-content: center; }
  .nav-btn span:not(.nav-icon) { display: none; }
  .sidebar-footer { padding: 8px 6px; }
  .btn-back { font-size: 0; padding: 10px; margin-bottom: 6px; }
  .btn-back::before { content: "←"; font-size: 1.1rem; }
  .btn-export { font-size: 0; padding: 10px; }
  .btn-export::before { content: "⬇"; font-size: 1.1rem; }
  .btn-reset { font-size: 0; margin-top: 4px; padding: 8px; }
  .btn-reset::before { content: "🗑"; font-size: .9rem; }
  .topbar { padding: 0 16px; }
  .content { padding: 16px; }
  .field-row { grid-template-columns: 160px 1fr; }
  .participants-grid { grid-template-columns: repeat(2, 1fr); }
  .retour-row { grid-template-columns: 130px auto auto 1fr; }
}
@media (max-width: 600px) {
  html, body { height: 100%; }
  .app { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
  .sidebar { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; min-width: 0; height: auto; z-index: 200; border-right: none; border-top: 1px solid var(--border); flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: env(safe-area-inset-bottom, 0); box-shadow: 0 -4px 16px rgba(0,0,0,.3); }
  .sidebar-logo { display: none; }
  .nav { display: flex; flex-direction: row; padding: 4px; flex: 1; overflow-x: auto; }
  .nav-btn { flex-direction: column; gap: 2px; padding: 6px 10px; min-width: 56px; border-radius: 8px; }
  .nav-btn > span:not(.nav-icon) { display: block; font-size: .6rem; }
  .sidebar-footer { padding: 4px 6px; border-top: none; border-left: 1px solid var(--border); display: flex; align-items: center; gap: 4px; }
  .btn-back { width: auto; margin-bottom: 0; padding: 8px; font-size: 0; }
  .btn-back::before { content: "←"; font-size: 1.1rem; }
  .btn-export, .btn-reset { margin: 0; padding: 8px 12px; font-size: .75rem; width: auto; }
  .btn-export::before, .btn-reset::before { content: none; }
  .main { order: 1; overflow: visible; flex: none; min-height: 0; }
  .topbar { height: 48px; padding: 0 14px; position: sticky; top: 0; z-index: 100; }
  .topbar-title { font-size: .95rem; }
  .progress-bar { width: 100px; }
  .content { padding: 12px; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); overflow-y: visible; }
  .field-row { grid-template-columns: 1fr; gap: 4px; padding: 10px 0; }
  .field-label { padding-top: 0; }
  .participants-grid { grid-template-columns: 1fr 1fr; }
  .retour-row { grid-template-columns: 1fr; gap: 6px; }
  .checkbox-pair { flex-wrap: wrap; }
}

/* ═══ PHOTOS MULTI ═══ */
.photo-multi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.photo-cat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color .15s;
}
.photo-cat-card.has-photo { border-color: var(--ok); }
.photo-cat-header {
  padding: 11px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(56,189,248,.04);
}
.photo-cat-title { font-size: .85rem; font-weight: 600; color: var(--text); }
.photo-cat-count {
  font-family: 'DM Mono', monospace;
  font-size: .7rem; color: var(--ok);
  background: rgba(52,211,153,.12);
  padding: 2px 8px; border-radius: 20px;
  display: none;
}
.photo-cat-count.show { display: block; }
.photo-thumbs {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 10px 12px;
  min-height: 0;
}
.photo-thumb-wrap {
  position: relative;
  width: 72px; height: 72px;
  border-radius: 6px; overflow: hidden;
  border: 1px solid var(--border);
}
.photo-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-thumb-del {
  position: absolute; top: 2px; right: 2px;
  background: rgba(0,0,0,.7); color: #fff;
  border: none; border-radius: 50%;
  width: 18px; height: 18px; font-size: .65rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .15s;
}
.photo-thumb-wrap:hover .photo-thumb-del { opacity: 1; }
.photo-cat-actions {
  padding: 8px 12px 12px;
  display: flex; gap: 8px;
}
.btn-photo-cam, .btn-photo-gal {
  flex: 1; padding: 8px 6px;
  border-radius: 7px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
  font-size: .78rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all .12s; font-family: 'DM Sans', sans-serif;
}
.btn-photo-cam { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.btn-photo-cam:hover { opacity: .85; }
.btn-photo-gal:hover { border-color: var(--accent2); color: var(--accent2); }
.photo-file-hidden { display: none; }

/* ═══ PRINT PHOTOS ═══ */
.print-photos-section { display: none; }

@media (max-width: 600px) {
  .photo-multi-grid { grid-template-columns: 1fr; }
}

/* ═══ PRINT ═══ */
@media print {
  @page { margin: 15mm; size: A4; }
  body { background: #fff !important; color: #111 !important; }
  .app { display: block !important; height: auto !important; }
  .sidebar, .topbar, .btn-export, .btn-add-row, .btn-del-row, .btn-reset { display: none !important; }
  .main { overflow: visible !important; }
  .content { overflow: visible !important; padding: 0 !important; }
  .page { display: block !important; }
  .print-header { display: block !important; }
  .section-card { background: #fff !important; border: 1px solid #ccc !important; margin-bottom: 12px; page-break-inside: avoid; }
  .section-card-header { background: #e0f4f8 !important; border-bottom: 1px solid #ccc !important; }
  .section-card-header h3 { color: #1a7a8a !important; }
  .field-label { color: #555 !important; }
  .field-input, textarea.field-input { background: #fafafa !important; border: 1px solid #ccc !important; color: #111 !important; }
  .__print-hide { display: none !important; }
  .__print-value { display: block !important; background: #fafafa !important; border: 1px solid #ccc !important; border-radius: 7px; color: #111 !important; font-family: 'DM Mono', monospace; font-size: .82rem; padding: 7px 11px; white-space: pre-wrap; word-break: break-word; }
  .rapnum-display { background: #fafafa !important; border: 1px solid #f0b429 !important; color: #c07a00 !important; }
  .ras-btn.active { background: #e6faf3 !important; border-color: #2a9e6a !important; color: #1a6a47 !important; }
  .reserve-btn.active { background: #fef0f0 !important; border-color: #d04040 !important; color: #a03030 !important; }
  .ras-btn:not(.active), .reserve-btn:not(.active) { opacity: .3 !important; }
  .retour-comment { background: #fafafa !important; border: 1px solid #ccc !important; color: #111 !important; }
  .participant-card { background: #fafafa !important; border: 1px solid #ccc !important; }
  .participant-card textarea { color: #111 !important; }
  .actions-table input { background: #fafafa !important; border: 1px solid #ccc !important; color: #111 !important; }
  .print-photos-section { display: block !important; }
  .photo-cat-actions, .btn-photo-cam, .btn-photo-gal, .photo-thumb-del { display: none !important; }
  .photo-thumb-wrap { border: 1px solid #ddd !important; }
}
.print-header, .__print-value { display: none; }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>🏗 Fermeture</h1>
      <p id="doc-context-label">Rapport Chantier</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <button class="btn-back" onclick="goBackToProject()">← Retour au projet</button>
      <button class="btn-export" onclick="exportPDF()">⬇ Exporter PDF</button>
      <button class="btn-reset" onclick="confirmReset()">🗑 Vider ce rapport</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbar-title"></span>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label">0%</span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-reset">
  <div class="modal-box">
    <h2>🗑 Nouveau rapport ?</h2>
    <p>Toutes les données du formulaire actuel seront effacées.<br>Le compteur sera incrémenté.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-btn confirm" onclick="doReset()">Confirmer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="jspdf.umd.min.js"></script>
<script>
/* ═══ CONFIG PAGES ═══ */
const PAGES = [
  { id:'entete',     icon:'📋', title:'En-tête' },
  { id:'participants',icon:'👥', title:'Participants' },
  { id:'reunion',    icon:'📝', title:'Réunion' },
  { id:'ouvrage',    icon:'🏗', title:'Ouvrage' },

const PFX = 'doc_' + DOC_ID + '_';

/* ═══ STORAGE ═══ */
function s(id, val) { try { localStorage.setItem(PFX+id, val); } catch(e){} }
function g(id, def='') { try { const v=localStorage.getItem(PFX+id); return v!==null?v:def; } catch(e){ return def; } }
function sj(id, val) { try { localStorage.setItem(PFX+id, JSON.stringify(val)); } catch(e){} }
function gj(id, def) { try { const v=localStorage.getItem(PFX+id); return v?JSON.parse(v):def; } catch(e){ return def; } }

/* ═══ RAPPORT NUM ═══ */
function buildRapNum() {
  const proj = (g('projet_nom')||'').trim().replace(/[^a-zA-Z0-9]/g,'').toUpperCase().substring(0,12);
  const num  = String(parseInt(localStorage.getItem(PFX+'rapnum_counter')||'1')).padStart(2,'0');
  return [proj, 'RAPFC', num].filter(Boolean).join(' - ');
}
function updateRapNum() {
  const val = buildRapNum();
  s('rapport_num', val);
  const el = document.getElementById('f_rapport_num');
  if (el) el.textContent = val || 'Sera généré automatiquement';
}

function buildNav() {

function switchPage(idx) {
  PAGES.forEach((p,i) => {
    document.getElementById('page-'+p.id)?.classList.toggle('active', i===idx);

/* ═══ HELPERS ═══ */
function page(id) {
  const d = document.createElement('div');
  d.className = 'page' + (id===PAGES[0].id?' active':'');

  return d;
}

function card(title, bodyHtml) {
  const d = document.createElement('div');
  d.className = 'section-card';
  d.innerHTML = `<div class="section-card-header"><h3>${title}</h3></div><div class="section-card-body">${bodyHtml}</div>`;
  return d;
}

function retourCard(title, items) {
  const d = document.createElement('div');
  d.className = 'section-card';
  let rows = items.map(item => `
    <div class="retour-row" id="row-${item.id}">
      <span class="retour-label">${item.label}</span>
      <div class="checkbox-pair">
        <button class="ras-btn" id="ras-${item.id}" onclick="toggleRetour('${item.id}','ras')">✔ RAS</button>
        <button class="reserve-btn" id="res-${item.id}" onclick="toggleRetour('${item.id}','reserve')">⚠ Réserves</button>
      </div>
      <input class="retour-comment" id="cmt-${item.id}" placeholder="Commentaire..." value="${esc(g('retour_cmt_'+item.id))}" oninput="s('retour_cmt_${item.id}',this.value)">
      <div class="reserve-action-block" id="actblk-${item.id}">
        <div class="reserve-action-title">⚡ Action liée à cette réserve</div>
        <div class="reserve-action-fields">
          <input id="act-qui-${item.id}"    placeholder="Responsable (Qui)"  value="${esc(g('retour_act_qui_'+item.id))}"    oninput="s('retour_act_qui_${item.id}',this.value);syncReserveActions()">
          <input id="act-date-${item.id}"   placeholder="Date (jj/mm/aaaa)"  value="${esc(g('retour_act_date_'+item.id))}"   oninput="s('retour_act_date_${item.id}',this.value);syncReserveActions()">
          <input id="act-action-${item.id}" placeholder="Description de l'action..." value="${esc(g('retour_act_action_'+item.id))}" oninput="s('retour_act_action_${item.id}',this.value);syncReserveActions()">
        </div>
      </div>
    </div>`).join('');

function toggleRetour(id, type) {
  const current = g('retour_'+id);
  const newVal = current === type ? '' : type;
  s('retour_'+id, newVal);
  const rasBtn = document.getElementById('ras-'+id);
  const resBtn = document.getElementById('res-'+id);
  const actBlk = document.getElementById('actblk-'+id);
  if (rasBtn) rasBtn.classList.toggle('active', newVal==='ras');
  if (resBtn) resBtn.classList.toggle('active', newVal==='reserve');
  if (actBlk) actBlk.classList.toggle('visible', newVal==='reserve');
  syncReserveActions();
}

function restoreRetour() {
  const items = ['modules','onduleurs','shelter','batiment','cablage','tension','raccordement','monitoring','autres'];
  items.forEach(id => {
    const val = g('retour_'+id);
    const rasBtn = document.getElementById('ras-'+id);
    const resBtn = document.getElementById('res-'+id);
    const actBlk = document.getElementById('actblk-'+id);
    if (rasBtn) rasBtn.classList.toggle('active', val==='ras');
    if (resBtn) resBtn.classList.toggle('active', val==='reserve');
    if (actBlk) actBlk.classList.toggle('visible', val==='reserve');
  });
  syncReserveActions();
}

/* ═══ SYNC RESERVE → ACTIONS ═══ */
const RETOUR_ITEMS = [
  { id:'modules',       label:'Modules' },
  { id:'onduleurs',     label:'Onduleurs' },
  { id:'shelter',       label:'Shelter' },
  { id:'batiment',      label:'Bâtiment' },
  { id:'cablage',       label:'Câblage' },
  { id:'tension',       label:'Tension' },
  { id:'raccordement',  label:'Raccordement' },
  { id:'monitoring',    label:'Monitoring' },
  { id:'autres',        label:'Autres' },
];

function syncReserveActions() {
  // Collect all actions that come from reserves
  const reserveActions = RETOUR_ITEMS
    .filter(item => g('retour_'+item.id) === 'reserve')
    .map(item => ({
      _reserveId: item.id,
      qui:    g('retour_act_qui_'+item.id),
      date:   g('retour_act_date_'+item.id),
      action: g('retour_act_action_'+item.id) || '[Réserve : '+item.label+']',
    }));

  // Load current manual rows (those without _reserveId)
  const manualRows = actionRows.filter(r => !r._reserveId);

  // Merge: reserve actions first, then manual
  actionRows = [...reserveActions, ...manualRows];
  sj('action_rows', actionRows);
  renderActions();
}

/* ═══ ACTIONS TABLE ═══ */
function buildActions() {
  const all = gj('action_rows', []);
  // On restore, keep manual rows only; reserve rows will be rebuilt by syncReserveActions
  actionRows = all.filter(r => !r._reserveId);
  if (actionRows.length === 0) actionRows = [{ qui:'', date:'', action:'' }];
  renderActions();
}

function renderActions() {
  const tbody = document.getElementById('actions-tbody');
  if (!tbody) return;
  tbody.innerHTML = '';
  actionRows.forEach((row, i) => {
    const tr = document.createElement('tr');
    const isReserve = !!row._reserveId;
    if (isReserve) {
      tr.style.cssText = 'background:rgba(248,113,113,.06);';
    }
    const badge = isReserve
      ? `<span style="font-size:.65rem;color:var(--danger);font-family:'DM Mono',monospace;margin-right:6px;opacity:.8">⚠ ${row._reserveId}</span>`
      : '';
    tr.innerHTML = `
      <td><input value="${esc(row.qui)}" placeholder="Responsable" ${isReserve?'style="border-color:rgba(248,113,113,.3)"':''} oninput="actionRows[${i}].qui=this.value;sj('action_rows',actionRows)"></td>
      <td><input value="${esc(row.date)}" placeholder="jj/mm/aaaa" ${isReserve?'style="border-color:rgba(248,113,113,.3)"':''} oninput="actionRows[${i}].date=this.value;sj('action_rows',actionRows)"></td>
      <td><div style="display:flex;align-items:center">${badge}<input value="${esc(row.action)}" placeholder="Description de l'action..." ${isReserve?'style="border-color:rgba(248,113,113,.3)"':''} oninput="actionRows[${i}].action=this.value;sj('action_rows',actionRows)"></div></td>
      <td>${isReserve ? '<span style="font-size:.7rem;color:var(--muted);padding:4px 8px" title="Gérer depuis la section Ouvrage/Électrique">🔒</span>' : `<button class="btn-del-row" onclick="delActionRow(${i})">✕</button>`}</td>`;
    tbody.appendChild(tr);
  });
}

function addActionRow() {
  actionRows.push({ qui:'', date:'', action:'' });
  sj('action_rows', actionRows);
  renderActions();
}

function delActionRow(i) {
  const row = actionRows[i];
  if (!row || row._reserveId) return; // can't delete reserve-linked rows
  const manualRows = actionRows.filter(r => !r._reserveId);
  if (manualRows.length <= 1) return;
  actionRows.splice(i, 1);
  sj('action_rows', actionRows);
  renderActions();
}

/* ═══ PHOTOS MULTI ═══ */
function catId(label) { return label.replace(/[^a-zA-Z0-9]/g,'_'); }

function buildPhotoCategories() {
  const grid = document.getElementById('photo-multi-grid');
  if (!grid) return;
  grid.innerHTML = '';
  PHOTO_CATEGORIES.forEach(label => {
    const cid = catId(label);
    const card = document.createElement('div');
    card.className = 'photo-cat-card';
    card.id = 'pcat-'+cid;
    card.innerHTML = `
      <div class="photo-cat-header">
        <span class="photo-cat-title">${label}</span>
        <span class="photo-cat-count" id="pcnt-${cid}">0 photo(s)</span>
      </div>
      <div class="photo-thumbs" id="pthumbs-${cid}"></div>
      <div class="photo-cat-actions">
        <input type="file" accept="image/*" capture="environment" class="photo-file-hidden" id="pcam-${cid}" multiple onchange="handlePhotos('${label}',this)">
        <input type="file" accept="image/*" class="photo-file-hidden" id="pgal-${cid}" multiple onchange="handlePhotos('${label}',this)">
        <button class="btn-photo-cam" onclick="document.getElementById('pcam-${cid}').click()">📷 Photo</button>
        <button class="btn-photo-gal" onclick="document.getElementById('pgal-${cid}').click()">🖼 Galerie</button>
      </div>`;
    grid.appendChild(card);
  });
}

function handlePhotos(label, input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  if (!photoData[label]) photoData[label] = [];
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      photoData[label].push(e.target.result);
      loaded++;
      if (loaded === files.length) {
        savePhotos();
        renderPhotoThumbs(label);
        showToast(`✔ ${files.length} photo(s) ajoutée(s) — ${label}`);
      }
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderPhotoThumbs(label) {
  const cid = catId(label);
  const container = document.getElementById('pthumbs-'+cid);
  const countEl   = document.getElementById('pcnt-'+cid);
  const cardEl    = document.getElementById('pcat-'+cid);
  if (!container) return;
  const photos = photoData[label] || [];
  container.innerHTML = photos.map((dataUrl, i) => `
    <div class="photo-thumb-wrap">
      <img src="${dataUrl}" alt="">
      <button class="photo-thumb-del" onclick="deletePhoto('${label}',${i})">✕</button>
    </div>`).join('');
  if (countEl) { countEl.textContent = photos.length+' photo(s)'; countEl.classList.toggle('show', photos.length>0); }
  if (cardEl)  cardEl.classList.toggle('has-photo', photos.length>0);
}

function deletePhoto(label, idx) {
  if (!photoData[label]) return;
  photoData[label].splice(idx, 1);
  savePhotos();
  renderPhotoThumbs(label);
}

function savePhotos() { sj('photos', photoData); }

function restorePhotos() {
  const saved = gj('photos', {});
  Object.assign(photoData, saved);
  PHOTO_CATEGORIES.forEach(label => { if (photoData[label]?.length) renderPhotoThumbs(label); });
}

/* ═══════════════════════════════════════════
   EXPORT PDF (génération directe, sans passer par
   l'impression du navigateur — plus fiable sur mobile)
═══════════════════════════════════════════ */
function __loadImageDims(dataUrl){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve({ w: 0, h: 0 });
    img.src = dataUrl;
  });
}

async function exportPDF() {
  showToast('📄 Génération du PDF en cours…', 4000);
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    const pageW=210, pageH=297, marginX=15, contentW=pageW-marginX*2, bottomLimit=pageH-15;
    let y=20;
    const checkBreak=(needed)=>{ if(y+needed>bottomLimit){ doc.addPage(); y=20; } };
    const sectionTitle=(t)=>{
      checkBreak(10);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(26,122,138);
      doc.text(t, marginX, y); y+=3;
      doc.setDrawColor(210,210,210); doc.setLineWidth(0.2);
      doc.line(marginX,y,pageW-marginX,y); y+=5;
    };
    const addField=(label,val)=>{
      const value=(val&&String(val).trim())?String(val):'\u2014';
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(60,60,60);
      const labelText=label+' :';
      doc.text(labelText, marginX, y);
      const labelW=doc.getTextWidth(labelText);
      const valX=marginX+Math.min(labelW+3,70);
      const valW=contentW-(valX-marginX);
      doc.setFont('helvetica','normal'); doc.setTextColor(15,15,15);
      const lines=doc.splitTextToSize(value, valW);
      checkBreak(lines.length*4.3+2);
      doc.setFont('helvetica','bold'); doc.setTextColor(60,60,60);
      doc.text(labelText, marginX, y);
      doc.setFont('helvetica','normal'); doc.setTextColor(15,15,15);
      doc.text(lines, valX, y);
      y += Math.max(lines.length*4.3,4.3)+1.8;
    };

    const proj=g('projet_nom')||'\u2014', tech=g('technicien')||'\u2014', date=g('date')||new Date().toLocaleDateString('fr-FR');
    const rapnum=buildRapNum()||'\u2014';
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(26,122,138);
    doc.text('RAPPORT FERMETURE CHANTIER', marginX, y); y+=6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(85,85,85);
    doc.text(`N° : ${rapnum}`, marginX, y); y+=5;
    doc.text(`Projet : ${proj}   |   Technicien : ${tech}   |   Date : ${date}`, marginX, y); y+=4;
    doc.setDrawColor(26,122,138); doc.setLineWidth(0.6);
    doc.line(marginX,y,pageW-marginX,y); y+=8;

    sectionTitle('Informations du projet');
    addField('Localisation / GPS', g('localisation'));
    addField('Nom du client', g('client_nom'));
    addField('Puissance prévue (kWc)', g('puissance'));
    addField("Type d'installation", g('type_installation'));
    addField('Type de projet', g('type_projet'));

    sectionTitle('Participants présents');
    for(let i=1;i<=5;i++){
      const p=g('participant_'+i);
      if(p && p.trim()) addField('Participant '+i, p.replace(/\n/g,' — '));
    }

    sectionTitle('Points de la réunion');
    addField('Rappel du projet', g('rappel_projet'));
    addField('Durée des travaux', g('duree_travaux'));
    addField('Date de mise en service sous-traitant', g('date_mes_st'));
    addField('Date de mise en service NEOS', g('date_mes_neos'));
    addField('Points spécifiques', g('points_specifiques'));

    const addRetourItems = (title, items) => {
      sectionTitle(title);
      items.forEach(item=>{
        const state=g('retour_'+item.id);
        const stateTxt = state==='ras' ? 'RAS' : state==='reserve' ? 'Réserves' : '\u2014';
        addField(item.label, stateTxt);
        const cmt=g('retour_cmt_'+item.id);
        if(cmt && cmt.trim()) addField('  Commentaire', cmt);
        if(state==='reserve'){
          const qui=g('retour_act_qui_'+item.id), d=g('retour_act_date_'+item.id), act=g('retour_act_action_'+item.id);
          if(qui||d||act) addField('  Action liée', `${act||'\u2014'} (Responsable: ${qui||'\u2014'}, Date: ${d||'\u2014'})`);
        }
      });
    };
    addRetourItems("Retour sur l'ouvrage", [
      { id:'modules',  label:'Modules' },
      { id:'onduleurs',label:'Onduleurs (n° de série)' },
      { id:'shelter',  label:'Shelter' },
      { id:'batiment', label:'Bâtiment' },
    ]);
    addRetourItems("Retour sur l'ouvrage électrique", [
      { id:'cablage',      label:'Câblage' },
      { id:'tension',      label:'Tension' },
      { id:'raccordement', label:'Raccordement' },
      { id:'monitoring',   label:'Monitoring' },
      { id:'autres',       label:'Autres' },
    ]);

    sectionTitle('Actions à mener');
    (actionRows||[]).forEach((row,i)=>{
      if(row.qui || row.date || row.action){
        addField(`Action ${i+1}`, `${row.action||'\u2014'} (Responsable: ${row.qui||'\u2014'}, Date: ${row.date||'\u2014'})`);
      }
    });

    sectionTitle('Prochaine réunion');
    addField('Prochaine réunion', g('prochaine_reunion','À définir'));
    addField('Date', g('date_prochaine_reunion'));

    // Photos
    const categoriesWithPhotos = PHOTO_CATEGORIES.filter(label => (photoData[label]||[]).length);
    if(categoriesWithPhotos.length){
      doc.addPage(); y=20;
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(26,122,138);
      doc.text('PHOTOS', marginX, y); y+=9;
      for(const label of categoriesWithPhotos){
        const photos=photoData[label]||[];
        checkBreak(8);
        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(26,122,138);
        doc.text(label, marginX, y); y+=5;
        for(const dataUrl of photos){
          const dims = await __loadImageDims(dataUrl);
          let imgW=contentW, imgH=70;
          if(dims.w && dims.h){
            imgW=Math.min(contentW,130); imgH=imgW*(dims.h/dims.w);
            if(imgH>100){ imgH=100; imgW=imgH*(dims.w/dims.h); }
          }
          checkBreak(imgH+6);
          try {
            const fmt = dataUrl.startsWith('data:image/png') ? 'PNG' : 'JPEG';
            doc.addImage(dataUrl, fmt, marginX, y, imgW, imgH);
            y += imgH+4;
          } catch(e){
            doc.setFont('helvetica','italic'); doc.setFontSize(8.5);
            doc.text('(photo non intégrée)', marginX, y); y+=5;
          }
        }
        y+=3;
      }
    }

    const filename = `RapportFermeture_${rapnum.replace(/[^a-zA-Z0-9-]/g,'_')}.pdf`;
    doc.save(filename);
    showToast('✔ PDF généré : '+filename, 3500);
  } catch(e){
    console.error(e);
    showToast('\u274c Erreur lors de la génération du PDF : '+e.message, 6000);
  }
}

/* ═══ RESET ═══ */
function confirmReset() { document.getElementById('modal-reset').classList.add('show'); }
function closeModal() { document.getElementById('modal-reset').classList.remove('show'); }
function doReset() {
  const n = parseInt(localStorage.getItem(PFX+'rapnum_counter')||'0') + 1;
  localStorage.setItem(PFX+'rapnum_counter', String(n));
  Object.keys(localStorage).filter(k=>k.startsWith(PFX)&&k!==PFX+'rapnum_counter').forEach(k=>localStorage.removeItem(k));
  actionRows = [];
  Object.keys(photoData).forEach(k => delete photoData[k]);
  closeModal();
  document.getElementById('content').innerHTML = '';
  document.getElementById('nav').innerHTML = '';
  buildNav();
  buildContent();
  switchPage(0);
  updateProgress();
  showToast(`✔ Nouveau rapport — N° ${String(n).padStart(2,'0')}`);
}

/* ═══ TOAST ═══ */
function showToast(msg, d=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), d);
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══ INIT ═══ */
(function init() {
  if (!localStorage.getItem(PFX+'rapnum_counter')) localStorage.setItem(PFX+'rapnum_counter','1');
  buildNav();
  buildContent();
  switchPage(0);
  updateProgress();
  showToast('📋 Formulaire chargé — données sauvegardées automatiquement');
})();
</script>
</body>
</html>
